<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>退会 | ご近所ワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- ===== ヘッダー（共通） ===== -->
  <header class="site-header">
    <div class="header-inner">
      <!-- ロゴ -->
      <a href="/" class="header-logo">
        <span class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 3L2 12h3v13h7v-8h4v8h7V12h3L14 3z" fill="#fff"/>
          </svg>
        </span>
        <span class="logo-text">ご近所ワーク</span>
        <span class="logo-role">発注者としてログイン中</span>
      </a>

      <!-- ナビゲーション（中央配置） -->
      <nav class="header-nav" id="headerNav">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="../order/list.html" class="nav-link">
              <span class="nav-text">案件作成・一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="../payment/list.html" class="nav-link">
              <span class="nav-text">報酬支払い情報</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">メッセージ一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">お問い合わせ</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">メニュー・価格表</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">ヘルプ</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- 右側: 通知ベル ＋ アカウント情報（アクティブ） -->
      <div class="nav-actions">
        <a href="index.html" class="nav-user nav-user--active" aria-label="アカウント情報">
          <span class="header-avatar-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <span class="header-username">aaaaaa さん</span>
          <svg class="chevron-down" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </a>
      </div>

      <!-- ハンバーガーメニュー（モバイル用） -->
      <button class="hamburger" id="hamburgerBtn" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- ===== メインコンテンツ ===== -->
  <main class="notif-main">

    <!-- ページヘッダー -->
    <div class="notif-page-header">
      <a href="index.html" class="notif-back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>
      <h1 class="notif-page-title">退会</h1>
    </div>

    <!-- 退会セクション -->
    <div class="withdrawal-section">
      <p class="withdrawal-desc">運営にて退会処理をいたします。なお退会に関する質問などメールをさせていただく可能性がございますのでご了承ください。</p>
      <button type="button" class="btn-withdrawal">退会申請する</button>
    </div>

  </main>

  <!-- ===== フッター（共通） ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>

          <li><a href="#">お仕事をお探しの方はこちら</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 2020 gokinjowork Inc.</p>
    </div>
  </footer>
