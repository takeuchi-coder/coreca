<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案件一覧 | ご近所ワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
</head>
<body class="wmypage-body wmylist-body">

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">

      <a href="mypage.html" class="header-logo">
        <span class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 3L2 12h3v13h7v-8h4v8h7V12h3L14 3z" fill="#fff"/>
          </svg>
        </span>
        <span class="logo-text">ご近所ワーク</span>
        <span class="logo-role">受注者としてログイン</span>
      </a>

      <nav class="header-nav" aria-label="メインナビゲーション">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="notification.html" class="nav-link">
              <span class="nav-text">通知</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="search.html" class="nav-link">
              <span class="nav-text">案件検索</span>
            </a>
          </li>
          <li class="nav-item nav-item--active">
            <a href="my-list.html" class="nav-link">
              <span class="nav-text">案件一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">報酬情報</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">メッセージ一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">お問い合わせ</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">ご利用マニュアル</span>
            </a>
          </li>
        </ul>

        <div class="nav-actions">
          <div class="wmypage-area-select">
            <select class="wmypage-area-dropdown" aria-label="エリアを選択">
              <option value="tokyo">東京都版</option>
              <option value="saitama">埼玉県版</option>
              <option value="kanagawa">神奈川県版</option>
              <option value="chiba">千葉県版</option>
            </select>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="wmypage-area-chevron">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <a href="mypage.html" class="nav-user" aria-label="アカウント情報">
            <span class="header-avatar-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
          </a>
        </div>
      </nav>

    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- ===== メインコンテンツ ===== -->
  <main class="wmylist-main">
    <div class="wmylist-inner">

      <!-- ページタイトル -->
      <div class="wmylist-title-row">
        <h1 class="wmylist-title">案件一覧</h1>
      </div>
      <hr class="wmylist-title-rule">

      <!-- タブ -->
      <div class="wmylist-tabs" role="tablist">
        <button class="wmylist-tab wmylist-tab--active" role="tab" aria-selected="true">エントリー中</button>
        <button class="wmylist-tab" role="tab" aria-selected="false">進行中</button>
        <button class="wmylist-tab" role="tab" aria-selected="false">完了</button>
      </div>

      <!-- 案件ID検索 -->
      <div class="wmylist-action-row">
        <button class="wmylist-id-search-btn" id="openSearchModal">案件ID検索</button>
      </div>

      <!-- 空状態 -->
      <div class="wmylist-empty">
        <p>該当する案件がありません。</p>
      </div>

    </div>
  </main>
  <!-- ===== /メインコンテンツ ===== -->

  <!-- ===== 案件ID検索モーダル ===== -->
  <div class="wmylist-modal-overlay" id="searchModal" aria-modal="true" role="dialog" aria-labelledby="searchModalTitle" hidden>
    <div class="wmylist-modal">
      <button class="wmylist-modal-close" id="closeSearchModal" aria-label="閉じる">&times;</button>
      <h2 class="wmylist-modal-title" id="searchModalTitle">絞り込み条件</h2>
      <hr class="wmylist-modal-rule">
      <div class="wmylist-modal-body">
        <div class="wmylist-modal-field">
          <label class="wmylist-modal-label" for="jobIdInput">案件ID</label>
          <input class="wmylist-modal-input" type="text" id="jobIdInput" placeholder="">
        </div>
      </div>
      <div class="wmylist-modal-footer">
        <button class="wmylist-modal-btn wmylist-modal-btn--clear" id="clearSearchModal">クリア</button>
        <button class="wmylist-modal-btn wmylist-modal-btn--submit">絞り込む</button>
      </div>
    </div>
  </div>
  <!-- ===== /案件ID検索モーダル ===== -->

  <!-- ===== フッター ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>
          <li><a href="#">利用規約</a></li>
          <li><a href="#">プライバシーポリシー</a></li>
          <li><a href="#">運営会社</a></li>
          <li><a href="#">お仕事依頼したい方はこちら</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 2020 gokinjowork Inc.</p>
    </div>
  </footer>


  <script>
    const overlay      = document.getElementById('searchModal');
    const openBtn      = document.getElementById('openSearchModal');
    const closeBtn     = document.getElementById('closeSearchModal');
    const clearBtn     = document.getElementById('clearSearchModal');
    const jobIdInput   = document.getElementById('jobIdInput');

    function openModal()  { overlay.hidden = false; jobIdInput.focus(); }
    function closeModal() { overlay.hidden = true; }

    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    clearBtn.addEventListener('click', () => { jobIdInput.value = ''; closeModal(); });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !overlay.hidden) closeModal(); });
  </script>
</body>
</html>
