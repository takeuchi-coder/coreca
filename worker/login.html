<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | コレカらワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
</head>
<body class="worker-body">

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">

      <a href="../index.html" class="header-logo">
        <img src="../images/logo.png" alt="コレからワーク" class="header-logo-img">
      </a>

      <nav class="header-nav" id="headerNav" aria-label="メインナビゲーション">
        <ul class="nav-list"></ul>
        <div class="nav-actions">
        </div>
      </nav>

      <!-- ハンバーガーメニュー（モバイル用） -->
      <button class="hamburger" id="hamburgerBtn" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- ===== メインコンテンツ ===== -->
  <main class="worker-main">
    <div class="worker-card">

      <!-- ページタイトル -->
      <h1 class="worker-page-title">ログイン</h1>
      <hr class="worker-title-rule">

      <!-- フォーム -->
      <form class="worker-form worker-form--login" action="#" method="post">

        <!-- メールアドレス -->
        <div class="worker-form-group">
          <label class="worker-label" for="email">メールアドレス</label>
          <input
            class="worker-input"
            type="email"
            id="email"
            name="email"
            placeholder="メールアドレスを入力してください"
            autocomplete="email"
          >
        </div>

        <hr class="worker-field-rule">

        <!-- パスワード -->
        <div class="worker-form-group">
          <label class="worker-label" for="password">パスワード</label>
          <input
            class="worker-input"
            type="password"
            id="password"
            name="password"
            placeholder="パスワードを入力してください"
            autocomplete="current-password"
          >
        </div>

        <!-- ログインボタン -->
        <div class="worker-btn-wrap">
          <button type="submit" class="btn-worker-login">ログイン</button>
        </div>

        <!-- リンク群 -->
        <div class="worker-form-links">
          <a href="password-reset.html" class="worker-text-link">パスワードを忘れた方はこちら</a>
          <a href="register.html" class="worker-text-link">無料会員登録はこちら</a>
        </div>

      </form>

    </div>
  </main>
  <!-- ===== /メインコンテンツ ===== -->

  <script>
    document.querySelector('.worker-form--login').addEventListener('submit', function (e) {
      e.preventDefault();
      location.href = 'mypage.html';
    });
  </script>

  <!-- ===== フッター ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>
          <li><a href="#">利用規約</a></li>
          <li><a href="#">プライバシーポリシー</a></li>
          <li><a href="#">運営会社</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 株式会社コレカ</p>
    </div>
  </footer>
  <!-- ===== /フッター ===== -->

  <script>
    (function () {
      var h = document.getElementById("hamburgerBtn");
      var n = document.getElementById("headerNav");
      if (h && n) h.addEventListener("click", function () { n.classList.toggle("is-open"); });
    })();
  </script>
</body>
</html>
