<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン（お仕事をお探しの方）| ご近所ワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
</head>
<body class="worker-body">

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">

      <a href="../index.html" class="header-logo">
        <span class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 3L2 12h3v13h7v-8h4v8h7V12h3L14 3z" fill="#fff"/>
          </svg>
        </span>
        <span class="logo-text">ご近所ワーク</span>
        <span class="logo-role">受注者としてログイン</span>
      </a>

      <nav class="header-nav" aria-label="メインナビゲーション">
        <ul class="nav-list"></ul>
        <div class="nav-actions">
        </div>
      </nav>

    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- ===== メインコンテンツ ===== -->
  <main class="worker-main">
    <div class="worker-card">

      <!-- ページタイトル -->
      <h1 class="worker-page-title">ログイン（お仕事をお探しの方）</h1>
      <hr class="worker-title-rule">

      <!-- フォーム -->
      <form class="worker-form worker-form--login" action="#" method="post">

        <!-- メールアドレス -->
        <div class="worker-form-group">
          <label class="worker-label" for="email">メールアドレス</label>
          <input
            class="worker-input"
            type="email"
            id="email"
            name="email"
            placeholder="メールアドレスを入力してください"
            autocomplete="email"
          >
        </div>

        <hr class="worker-field-rule">

        <!-- パスワード -->
        <div class="worker-form-group">
          <label class="worker-label" for="password">パスワード</label>
          <input
            class="worker-input"
            type="password"
            id="password"
            name="password"
            placeholder="パスワードを入力してください"
            autocomplete="current-password"
          >
        </div>

        <!-- ログインボタン -->
        <div class="worker-btn-wrap">
          <button type="submit" class="btn-worker-login">ログイン</button>
        </div>

        <!-- リンク群 -->
        <div class="worker-form-links">
          <a href="password-reset.html" class="worker-text-link">パスワードを忘れた方はこちら</a>
        </div>

      </form>

    </div>
  </main>
  <!-- ===== /メインコンテンツ ===== -->

  <!-- ===== 業種選択ポップアップ ===== -->
  <div class="wlogin-select-overlay" id="loginSelectOverlay" hidden>
    <div class="wlogin-select-modal" role="dialog" aria-modal="true" aria-labelledby="loginSelectTitle">

      <!-- 閉じるボタン -->
      <button class="wlogin-select-close" id="loginSelectClose" aria-label="閉じる">
        <svg class="wlogin-select-close-icon" viewBox="0 0 24 24" fill="none">
          <line x1="4" y1="4" x2="20" y2="20"/>
          <line x1="20" y1="4" x2="4" y2="20"/>
        </svg>
      </button>

      <!-- タイトル -->
      <p class="wlogin-select-title" id="loginSelectTitle">業種・依頼内容をお選びください</p>

      <!-- 選択ボタン一覧 -->
      <ul class="wlogin-select-list">
        <li>
          <button class="wlogin-select-btn" type="button">
            <span class="wlogin-select-btn-label">不動産管理事業者・オーナー様</span>
            <svg class="wlogin-select-arrow" viewBox="0 0 24 24" fill="none"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </li>
        <li>
          <button class="wlogin-select-btn" type="button">
            <span class="wlogin-select-btn-label">レンタルスペース管理者様</span>
            <svg class="wlogin-select-arrow" viewBox="0 0 24 24" fill="none"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </li>
        <li>
          <button class="wlogin-select-btn" type="button">
            <span class="wlogin-select-btn-label">店舗管理者様</span>
            <svg class="wlogin-select-arrow" viewBox="0 0 24 24" fill="none"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </li>
        <li>
          <button class="wlogin-select-btn" type="button">
            <span class="wlogin-select-btn-label">家事代行のご依頼</span>
            <svg class="wlogin-select-arrow" viewBox="0 0 24 24" fill="none"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </li>
        <li>
          <button class="wlogin-select-btn wlogin-select-btn--tall" type="button">
            <span class="wlogin-select-btn-label">上記以外の業種や依頼などの<br>お問い合わせはこちら</span>
            <svg class="wlogin-select-arrow" viewBox="0 0 24 24" fill="none"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </li>
      </ul>

    </div>
  </div>
  <!-- ===== /業種選択ポップアップ ===== -->

  <script>
    (function () {
      var overlay = document.getElementById('loginSelectOverlay');
      var closeBtn = document.getElementById('loginSelectClose');
      var form = document.querySelector('.worker-form--login');

      function openModal() {
        overlay.removeAttribute('hidden');
        closeBtn.focus();
      }

      function closeModal() {
        overlay.setAttribute('hidden', '');
      }

      // ログインボタン送信時にポップアップを表示
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          openModal();
        });
      }

      // 閉じるボタン
      if (closeBtn) {
        closeBtn.addEventListener('click', closeModal);
      }

      // オーバーレイ背景クリックで閉じる
      if (overlay) {
        overlay.addEventListener('click', function (e) {
          if (e.target === overlay) closeModal();
        });
      }

      // Escキーで閉じる
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !overlay.hasAttribute('hidden')) closeModal();
      });
    })();
  </script>

  <!-- ===== フッター ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>
          <li><a href="#">利用規約</a></li>
          <li><a href="#">プライバシーポリシー</a></li>
          <li><a href="#">運営会社</a></li>
          <li><a href="#">お仕事依頼したい方はこちら</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 2020 gokinjowork Inc.</p>
    </div>
  </footer>
  <!-- ===== /フッター ===== -->

</body>
</html>
