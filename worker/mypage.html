<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム | コレカらワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
</head>
<body class="wmypage-body">

  <!-- ===== ヘッダー（発注者デザイン統一） ===== -->
  <header class="site-header">
    <div class="header-inner">

      <!-- ロゴ ＋ 役割バッジ -->
      <a href="../index.html" class="header-logo">
        <img src="../images/logo.png" alt="コレからワーク" class="header-logo-img">
      </a>

      <!-- ナビゲーション -->
      <nav class="header-nav" id="headerNav" aria-label="メインナビゲーション">
        <ul class="nav-list">
          <li class="nav-item nav-item--active"><a href="mypage.html" class="nav-link"><span class="nav-text">マイページ</span></a></li>
          <li class="nav-item">
            <a href="search.html" class="nav-link">
              <span class="nav-text">案件検索</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="my-list.html" class="nav-link">
              <span class="nav-text">案件一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="reward.html" class="nav-link">
              <span class="nav-text">報酬情報</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="messages.html" class="nav-link">
              <span class="nav-text">メッセージ一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="contact.html" class="nav-link">
              <span class="nav-text">お問い合わせ</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="manual.html" class="nav-link">
              <span class="nav-text">ご利用マニュアル</span>
            </a>
          </li>
        </ul>

        <!-- 右側アクション -->
        <div class="nav-actions">
          <!-- アカウント情報アイコン -->
          <a href="mypage.html" class="nav-user nav-user--active" aria-label="アカウント情報">
            <span class="header-avatar-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
          </a>
        </div>
      </nav>

      <!-- ハンバーガーメニュー（モバイル用） -->
      <button class="hamburger" id="hamburgerBtn" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- ===== メインコンテンツ ===== -->
  <main class="wmypage-main">
    <div class="wsidebar-layout">

    <!-- ===== サイドバー ===== -->
    <aside class="wsidebar">
      <div class="wsidebar-balance">
        <span class="wsidebar-balance-label">残高</span>
        <span class="wsidebar-balance-value">0円</span>
      </div>
      <nav>
        <ul class="wsidebar-list">
          <li class="wsidebar-item"><a href="account-basic.html" class="wsidebar-link">基本情報</a></li>
          <li class="wsidebar-item"><a href="account-email-password.html" class="wsidebar-link">メール・パスワード変更</a></li>
          <li class="wsidebar-item"><a href="account-bank.html" class="wsidebar-link">銀行口座</a></li>
          <li class="wsidebar-item"><a href="transfer.html" class="wsidebar-link">振込申請</a></li>
          <li class="wsidebar-item"><a href="logout.html" class="wsidebar-link">ログアウト</a></li>
          <li class="wsidebar-item"><a href="withdrawal.html" class="wsidebar-link wsidebar-link--danger">退会</a></li>
        </ul>
      </nav>
    </aside>
    <!-- ===== /サイドバー ===== -->

    <div class="wmypage-content">

      <!-- ページタイトル -->
      <h1 class="wmypage-page-title">アカウント情報</h1>
      <hr class="wmypage-title-rule">

      <!-- アカウント情報カード -->
      <div class="wmypage-account-card">

        <!-- 残高行 -->

          <span class="wmypage-balance-label">残高</span>
          <span class="wmypage-balance-value">0円</span>
        </div>

        <!-- メニューリスト -->
        <ul class="wmypage-menu-list">

          <li class="wmypage-menu-item">
            <a href="account-basic.html" class="wmypage-menu-link">
              <span>基本情報</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </a>
          </li>

          <li class="wmypage-menu-item">
            <a href="account-email-password.html" class="wmypage-menu-link">
              <span>メール・パスワード変更</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </a>
          </li>


          <li class="wmypage-menu-item">
            <a href="account-bank.html" class="wmypage-menu-link">
              <span>銀行口座</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </a>
          </li>

          <li class="wmypage-menu-item">
            <a href="transfer.html" class="wmypage-menu-link">
              <span>振込申請</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </a>
          </li>

          <li class="wmypage-menu-item">
            <a href="logout.html" class="wmypage-menu-link">
              <span>ログアウト</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </a>
          </li>

          <li class="wmypage-menu-item wmypage-menu-item--last">
            <a href="#" class="wmypage-menu-link">
              <span>退会</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </a>
          </li>

        </ul>

      </div>

    </div>
    </div><!-- /wsidebar-layout -->

  <!-- ===== フッター ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>
          <li><a href="#">利用規約</a></li>
          <li><a href="#">プライバシーポリシー</a></li>
          <li><a href="#">運営会社</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 株式会社コレカ</p>
    </div>
  </footer>
  <!-- ===== /フッター ===== -->

  <script>
    (function () {
      var h = document.getElementById("hamburgerBtn");
      var n = document.getElementById("headerNav");
      if (h && n) h.addEventListener("click", function () { n.classList.toggle("is-open"); });
    })();
  </script>
</body>
</html>
