<!DOCTYPE html>

  <!-- Leaflet CSS -->

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
</head>
<body class="wmypage-body wsearch-body">

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">

      <a href="mypage.html" class="header-logo">

          </svg>
        </span>
        <span class="logo-text">ご近所ワーク</span>
        <span class="logo-role">受注者としてログイン</span>
      </a>

      <nav class="header-nav" aria-label="メインナビゲーション">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="notification.html" class="nav-link">
              <span class="nav-text">通知</span>
            </a>
          </li>
          <li class="nav-item nav-item--active">
            <a href="search.html" class="nav-link">
              <span class="nav-text">案件検索</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="my-list.html" class="nav-link">

            </a>
          </li>
          <li class="nav-item">
            <a href="reward.html" class="nav-link">
              <span class="nav-text">報酬情報</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="messages.html" class="nav-link">
              <span class="nav-text">メッセージ一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="contact.html" class="nav-link"><span class="nav-text">お問い合わせ</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="manual.html" class="nav-link"><span class="nav-text">ご利用マニュアル</span>
            </a>
          </li>
        </ul>

        <!-- 右側アクション -->
        <div class="nav-actions">
          <!-- エリア選択 -->
          <div class="wmypage-area-select">
            <select class="wmypage-area-dropdown" aria-label="エリアを選択">
              <option value="tokyo">東京都版</option>
              <option value="saitama">埼玉県版</option>
              <option value="kanagawa">神奈川県版</option>
              <option value="chiba">千葉県版</option>
            </select>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="wmypage-area-chevron">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <!-- アカウント情報アイコン -->
          <a href="mypage.html" class="nav-user" aria-label="アカウント情報">
            <span class="header-avatar-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
          </a>
        </div>
      </nav>

    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->


  <!-- ===== 地域選択モーダル ===== -->
  <div class="wregion-overlay" id="regionModal" role="dialog" aria-modal="true" aria-labelledby="regionModalLabel" hidden>
    <div class="wregion-modal">

      <!-- 全国 / 閉じる タブ行 -->
      <div class="wregion-tab-row">
        <button class="wregion-tab wregion-tab--all" id="regionAllBtn">全国</button>
        <button class="wregion-tab wregion-tab--close" id="regionCloseBtn">閉じる</button>
      </div>

      <!-- 地域グリッド -->
      <div class="wregion-grid" id="regionGrid">
        <button class="wregion-item" data-region="kanto">
          <span>関東</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="wregion-item" data-region="kansai">
          <span>関西</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="wregion-item" data-region="tokai">
          <span>東海</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="wregion-item" data-region="hokkaido">
          <span>北海道</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="wregion-item" data-region="tohoku">
          <span>東北</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="wregion-item" data-region="koshinetsu">
          <span>甲信越<br>北陸</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="wregion-item" data-region="chugoku">
          <span>中国</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="wregion-item" data-region="shikoku">
          <span>四国</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="wregion-item" data-region="kyushu">
          <span>九州<br>沖縄</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

    </div>
  </div>
  <!-- ===== /地域選択モーダル ===== -->

  <!-- ===== マップセクション ===== -->
  <div class="wsearch-map-section" id="mapSection">
    <!-- Leaflet マップ -->
    <div id="wsearchMap" class="wsearch-map"></div>

    <!-- 右上：応募可のみ トグル -->
    <div class="wsearch-map-filter">
      <label class="wsearch-toggle-wrap">
        <span class="wsearch-toggle-text">応募可のみ</span>
        <span class="wsearch-toggle">
          <input type="checkbox" id="availableOnly" checked>
          <span class="wsearch-toggle-slider"></span>
        </span>
      </label>
    </div>

    <!-- 上部中央：このエリアを検索 -->
    <button class="wsearch-area-btn" id="areaSearchBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      このエリアを検索
    </button>

    <!-- 右下：ボタン群 -->
    <div class="wsearch-map-actions" id="mapActions">
<button class="wsearch-map-action-btn" id="listViewBtn">
        <span class="wsearch-map-action-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </span>
        一覧でみる
      </button>
      <button class="wsearch-map-action-btn" id="currentLocationBtn">
        <span class="wsearch-map-action-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="3"/>
            <line x1="12" y1="2" x2="12" y2="5"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="5" y2="12"/>
            <line x1="19" y1="12" x2="22" y2="12"/>
          </svg>
        </span>
        現在地
      </button>
    </div>
  </div>
  <!-- ===== /マップセクション ===== -->

  <!-- ===== リスト表示セクション ===== -->
  <div class="wsearch-list-section" id="listSection" hidden>

    <!-- ヘッダー行：タイトル + トグルフィルター -->
    <div class="wsearch-list-header">
      <h2 class="wsearch-list-heading">案件検索</h2>
      <div class="wsearch-list-toggles">
<label class="wsearch-toggle-wrap">
          <span class="wsearch-toggle-text">応募可のみ</span>
          <span class="wsearch-toggle">
            <input type="checkbox" id="availableOnlyList" checked>
            <span class="wsearch-toggle-slider"></span>
          </span>
        </label>
      </div>
    </div>

    <!-- 案件リスト -->
    <div class="wsearch-list-items" id="jobListItems">
      <!-- JavaScript で生成 -->
    </div>

    <!-- 地図でみる フローティングボタン -->
    <button class="wsearch-mapview-btn" id="mapViewBtn" aria-label="地図表示に切り替え">
      <span class="wsearch-mapview-btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </span>
      地図でみる
    </button>

  </div>
  <!-- ===== /リスト表示セクション ===== -->

  <!-- ===== フッター ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>
          <li><a href="#">利用規約</a></li>
          <li><a href="#">プライバシーポリシー</a></li>
          <li><a href="#">運営会社</a></li>
          <li><a href="#">お仕事依頼したい方はこちら</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 2020 gokinjowork Inc.</p>
    </div>
  </footer>
  <!-- ===== /フッター ===== -->

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WPbM=" crossorigin=""></script>

  <script>
  /* =============================================
     案件サンプルデータ
  ============================================= */
  const JOBS = [
    {
      id: 1,
      title: '役所等での申請・書類取得',
      price: '¥1,000/件',
      hours: '09:00〜17:00',
      address: '愛知県半田市東洋町2-1',
      period: '2026年04月01日~2026年06月30日',
      daysLeft: 106,
      lat: 34.8897,
      lng: 136.9370,
      img: null
    },
    {
      id: 2,
      title: '共用部清掃_掃き・拭き上げ_6-10世帯',
      price: '¥1,200/件',
      hours: 'いつでも',
      address: '愛知県半田市東大矢知町',
      period: '即日~2026年03月31日',
      daysLeft: 15,
      lat: 34.8850,
      lng: 136.9350,
      img: null
    },
    {
      id: 3,
      title: '駐車場設置のEV充電器アップデート業務',
      price: '¥1,500/件',
      hours: 'いつでも',
      address: '愛知県常滑市 栄町7-108',
      period: '即日~2026年03月29日',
      daysLeft: 13,
      lat: 34.8920,
      lng: 136.8360,
      img: null
    },
    {
      id: 4,
      title: '植栽水やり・軽作業スタッフ募集',
      price: '¥2,000/件',
      hours: 'いつでも',
      address: '愛知県常滑市 栄町7-108',
      period: '即日~2026年03月29日',
      daysLeft: 13,
      lat: 34.8900,
      lng: 136.8400,
      img: null
    },
    {
      id: 5,
      title: 'マンション共用廊下清掃スタッフ',
      price: '¥1,800/件',
      hours: '09:00〜12:00',
      address: '愛知県知多市 新知字弐ノ割',
      period: '即日~2026年04月15日',
      daysLeft: 29,
      lat: 34.9100,
      lng: 136.9200,
      img: null
    }
  ];


  /* =============================================
     Leaflet マップ初期化
  ============================================= */
  const map = L.map('wsearchMap', {
    zoomControl: false,
    center: [35.6762, 139.6503],
    zoom: 13
  });

  // ズームコントロールを左上に
  L.control.zoom({ position: 'topleft' }).addTo(map);

  // OpenStreetMap タイル
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  // カスタムマーカーアイコン（赤丸に白い＋）
  function createJobIcon(active) {
    return L.divIcon({
      html: `<div class="wsearch-marker${active ? ' wsearch-marker--active' : ''}">+</div>`,
      className: '',
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });
  }

  let activeJobId = JOBS[0].id;
  const markerMap = {};

  function addMarkers() {
    JOBS.forEach(job => {
      const marker = L.marker([job.lat, job.lng], {
        icon: createJobIcon(job.id === activeJobId)
      }).addTo(map);

      marker.on('click', () => {
        selectJob(job.id);
      });

      markerMap[job.id] = marker;
    });
  }

  function updateMarkers() {
    JOBS.forEach(job => {
      if (markerMap[job.id]) {
        markerMap[job.id].setIcon(createJobIcon(job.id === activeJobId));
      }
    });
  }

  addMarkers();

  /* =============================================
     ビュー切り替え共通関数
  ============================================= */
  function showListView() {
    document.getElementById('mapSection').style.display = 'none';
    document.getElementById('listSection').style.display = 'flex';
    renderListItems();
  }

  function showMapView() {
    document.getElementById('listSection').style.display = 'none';
    document.getElementById('mapSection').style.display = '';
    setTimeout(() => map.invalidateSize(), 50);
  }

  /* =============================================
     リストでみる ボタン
  ============================================= */
  document.getElementById('listViewBtn').addEventListener('click', showListView);

  /* =============================================
     現在地 ボタン
  ============================================= */
  document.getElementById('currentLocationBtn').addEventListener('click', () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(pos => {
      map.panTo([pos.coords.latitude, pos.coords.longitude], { animate: true });
    });
  });

  /* =============================================
     地図でみる ボタン
  ============================================= */
  document.getElementById('mapViewBtn').addEventListener('click', showMapView);

  /* =============================================
     リスト表示：案件リストを生成
  ============================================= */
  function renderListItems() {
    const container = document.getElementById('jobListItems');
    container.innerHTML = '';

    JOBS.forEach(job => {
      const item = document.createElement('div');
      item.className = 'wsearch-list-item';

      const badgeClass = job.daysLeft <= 15
        ? 'wsearch-list-badge--red'
        : 'wsearch-list-badge--gray';

      item.innerHTML = `
        <div class="wsearch-list-thumb">
          <div class="wsearch-list-thumb-inner">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
        </div>
        <div class="wsearch-list-body">
          <div class="wsearch-list-top">
            <span class="wsearch-list-date">${job.period}</span>
            <span class="wsearch-list-badge ${badgeClass}">募集終了まで：あと${job.daysLeft}日</span>
          </div>
          <div class="wsearch-list-title">${job.title}</div>
          <div class="wsearch-list-price">${job.price}</div>
          <div class="wsearch-list-meta">
            <span class="wsearch-list-meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              ${job.hours}
            </span>
            <span class="wsearch-list-meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
              </svg>
              ${job.address}
            </span>
          </div>
        </div>
        <div class="wsearch-list-action">
          <a href="detail.html" class="wsearch-list-detail-btn wsearch-list-detail-btn--red">詳細をみる</a>
        </div>
      `;

      container.appendChild(item);
    });
  }

  /* =============================================
     マップのリサイズ対応
  ============================================= */
  window.addEventListener('resize', () => map.invalidateSize());

  /* =============================================
     地域選択モーダル
  ============================================= */
  (function () {
    var overlay   = document.getElementById('regionModal');
    // var openBtn   = document.getElementById('regionOpenBtn'); // 削除済みボタン
    var closeBtn  = document.getElementById('regionCloseBtn');
    var allBtn    = document.getElementById('regionAllBtn');
    var gridItems = document.querySelectorAll('.wregion-item');

    function closeRegionModal() {
      overlay.hidden = true;
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeRegionModal);

    allBtn.addEventListener('click', function () {
      // 全国選択：ここでは単純に閉じる（実装時に絞り込みリセットを追加）
      closeRegionModal();
    });

    gridItems.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var region = btn.dataset.region;
        // 地域選択後の処理をここに追加
        closeRegionModal();
      });
    });

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeRegionModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !overlay.hidden) closeRegionModal();
    });
  })();
  </script>

</body>
</html>
