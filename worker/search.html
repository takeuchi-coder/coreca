  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WPbM=" crossorigin=""></script>

  <script>
  /* =============================================
     案件サンプルデータ
  ============================================= */
  const JOBS = [
    {
      id: 1,
      title: '役所等での申請・書類取得',
      price: '¥1,000/件',
      hours: '09:00〜17:00',
      address: '愛知県半田市東洋町2-1',
      period: '2026年04月01日~2026年06月30日',
      daysLeft: 106,
      lat: 34.8897,
      lng: 136.9370,
      img: null
    },
    {
      id: 2,
      title: '共用部清掃_掃き・拭き上げ_6-10世帯',
      price: '¥1,200/件',
      hours: 'いつでも',
      address: '愛知県半田市東大矢知町',
      period: '即日~2026年03月31日',
      daysLeft: 15,
      lat: 34.8850,
      lng: 136.9350,
      img: null
    },
    {
      id: 3,
      title: '駐車場設置のEV充電器アップデート業務',
      price: '¥1,500/件',
      hours: 'いつでも',
      address: '愛知県常滑市 栄町7-108',
      period: '即日~2026年03月29日',
      daysLeft: 13,
      lat: 34.8920,
      lng: 136.8360,
      img: null
    },
    {
      id: 4,
      title: '植栽水やり・軽作業スタッフ募集',
      price: '¥2,000/件',
      hours: 'いつでも',
      address: '愛知県常滑市 栄町7-108',
      period: '即日~2026年03月29日',
      daysLeft: 13,
      lat: 34.8900,
      lng: 136.8400,
      img: null
    },
    {
      id: 5,
      title: 'マンション共用廊下清掃スタッフ',
      price: '¥1,800/件',
      hours: '09:00〜12:00',
      address: '愛知県知多市 新知字弐ノ割',
      period: '即日~2026年04月15日',
      daysLeft: 29,
      lat: 34.9100,
      lng: 136.9200,
      img: null
    }
  ];

  /* =============================================
     日付ピッカー
  ============================================= */
  const today = new Date(2025, 11, 2); // 2025-12-02（画像に合わせる）
  let selectedDate = new Date(today);
  let weekOffset = 0; // 0: 今週基準

  const WEEKDAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];
  const WEEKDAY_SHORT = ['(日)', '(月)', '(火)', '(水)', '(木)', '(金)', '(土)'];

  function getWeekStart(base, offset) {
    // 今日の曜日から日曜日を起点とした週の開始日を計算
    const d = new Date(base);
    d.setDate(d.getDate() - d.getDay() + offset * 7);
    return d;
  }

  function renderCalendar() {
    const list = document.getElementById('dateList');
    const titleEl = document.getElementById('searchDateTitle');
    list.innerHTML = '';

    const weekStart = getWeekStart(today, weekOffset);

    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart);
      d.setDate(weekStart.getDate() + i);

      const cell = document.createElement('button');
      cell.className = 'wsearch-date-cell';
      cell.textContent = d.getDate();

      // 土曜日
      if (i === 6) cell.classList.add('wsearch-date-cell--sat');
      // 日曜日
      if (i === 0) cell.classList.add('wsearch-date-cell--sun');
      // 前月 / 翌月
      if (d.getMonth() !== today.getMonth()) cell.classList.add('wsearch-date-cell--other');
      // 選択中
      if (d.toDateString() === selectedDate.toDateString()) {
        cell.classList.add('wsearch-date-cell--active');
      }

      cell.addEventListener('click', () => {
        selectedDate = new Date(d);
        renderCalendar();
        updateTitle();
        updateMarkers();
      });

      list.appendChild(cell);
    }
  }

  function updateTitle() {
    const el = document.getElementById('searchDateTitle');
    const m = selectedDate.getMonth() + 1;
    const day = selectedDate.getDate();
    const wd = WEEKDAY_NAMES[selectedDate.getDay()];
    el.textContent = `${selectedDate.getFullYear()}年${m}月${day}日(${wd})のお仕事`;
  }

  document.getElementById('prevWeek').addEventListener('click', () => {
    weekOffset--;
    renderCalendar();
  });
  document.getElementById('nextWeek').addEventListener('click', () => {
    weekOffset++;
    renderCalendar();
  });

  renderCalendar();
  updateTitle();

  /* =============================================
     在宅ワークボタン トグル
  ============================================= */
  const remoteBtn = document.getElementById('remoteBtn');
  remoteBtn.addEventListener('click', () => {
    remoteBtn.classList.toggle('wsearch-remote-btn--active');
  });

  /* =============================================
     Leaflet マップ初期化
  ============================================= */
  const map = L.map('wsearchMap', {
    zoomControl: false,
    center: [35.6762, 139.6503],
    zoom: 13
  });

  // ズームコントロールを左上に
  L.control.zoom({ position: 'topleft' }).addTo(map);

  // OpenStreetMap タイル
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  // カスタムマーカーアイコン（赤丸に白い＋）
  function createJobIcon(active) {
    return L.divIcon({
      html: `<div class="wsearch-marker${active ? ' wsearch-marker--active' : ''}">+</div>`,
      className: '',
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });
  }

  let activeJobId = JOBS[0].id;
  const markerMap = {};

  function addMarkers() {
    JOBS.forEach(job => {
      const marker = L.marker([job.lat, job.lng], {
        icon: createJobIcon(job.id === activeJobId)
      }).addTo(map);

      marker.on('click', () => {
        selectJob(job.id);
      });

      markerMap[job.id] = marker;
    });
  }

  function updateMarkers() {
    JOBS.forEach(job => {
      if (markerMap[job.id]) {
        markerMap[job.id].setIcon(createJobIcon(job.id === activeJobId));
      }
    });
  }

  addMarkers();

  /* =============================================
     案件カードカルーセル
  ============================================= */
  function renderCards() {
    const container = document.getElementById('jobCards');
    container.innerHTML = '';

    JOBS.forEach(job => {
      const card = document.createElement('div');
      card.className = 'wsearch-card' + (job.id === activeJobId ? ' wsearch-card--active' : '');
      card.dataset.jobId = job.id;

      // バッジの色：あと1日は赤、それ以上はオレンジ系
      const badgeClass = job.daysLeft <= 1 ? 'wsearch-card-badge--urgent' : 'wsearch-card-badge--soon';

      card.innerHTML = `
        <div class="wsearch-card-img">
          <div class="wsearch-card-img-placeholder">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
        </div>
        <div class="wsearch-card-body">
          <div class="wsearch-card-period">${job.period}</div>
          <div class="wsearch-card-badge ${badgeClass}">募集期間：あと${job.daysLeft}日</div>
          <div class="wsearch-card-title">${job.title}</div>
          <div class="wsearch-card-price">${job.price}</div>
          <div class="wsearch-card-addr">${job.address}</div>
        </div>
      `;

      card.addEventListener('click', () => selectJob(job.id));
      container.appendChild(card);
    });
  }

  function selectJob(jobId) {
    activeJobId = jobId;
    renderCards();
    updateMarkers();

    // 選択した案件のカードまでスクロール
    const activeCard = document.querySelector('.wsearch-card--active');
    if (activeCard) {
      activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    // マップを案件の位置に移動
    const job = JOBS.find(j => j.id === jobId);
    if (job) {
      map.panTo([job.lat, job.lng], { animate: true });
    }
  }

  renderCards();

  // カルーセル 矢印ナビ
  const viewport = document.querySelector('.wsearch-cards-viewport');
  const CARD_WIDTH = 256; // px (card width + gap)

  document.getElementById('carouselPrev').addEventListener('click', () => {
    viewport.scrollBy({ left: -CARD_WIDTH, behavior: 'smooth' });
  });
  document.getElementById('carouselNext').addEventListener('click', () => {
    viewport.scrollBy({ left: CARD_WIDTH, behavior: 'smooth' });
  });

  /* =============================================
     リスト表示：案件リストを生成
  ============================================= */
  function renderListItems() {
    const container = document.getElementById('jobListItems');
    container.innerHTML = '';

    JOBS.forEach(job => {
      const item = document.createElement('div');
      item.className = 'wsearch-list-item';

      const badgeClass = job.daysLeft <= 15
        ? 'wsearch-list-badge--red'
        : 'wsearch-list-badge--gray';

      item.innerHTML = `
        <div class="wsearch-list-thumb">
          <div class="wsearch-list-thumb-inner">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
        </div>
        <div class="wsearch-list-body">
          <div class="wsearch-list-top">
            <span class="wsearch-list-date">${job.period}</span>
            <span class="wsearch-list-badge ${badgeClass}">募集終了まで：あと${job.daysLeft}日</span>
          </div>
          <div class="wsearch-list-title">${job.title}</div>
          <div class="wsearch-list-price">${job.price}</div>
          <div class="wsearch-list-meta">
            <span class="wsearch-list-meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              ${job.hours}
            </span>
            <span class="wsearch-list-meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
              </svg>
              ${job.address}
            </span>
          </div>
        </div>
        <div class="wsearch-list-action">
          <a href="detail.html" class="wsearch-list-detail-btn">詳細をみる</a>
        </div>
      `;

      container.appendChild(item);
    });
  }

  /* =============================================
     リストでみる ボタン
  ============================================= */
  document.getElementById('listViewBtn').addEventListener('click', () => {
    document.querySelector('.wsearch-controls').hidden = true;
    document.querySelector('.wsearch-map-section').hidden = true;
    document.getElementById('listSection').hidden = false;
    renderListItems();
  });

  /* =============================================
     地図でみる ボタン
  ============================================= */
  document.getElementById('mapViewBtn').addEventListener('click', () => {
    document.getElementById('listSection').hidden = true;
    document.querySelector('.wsearch-controls').hidden = false;
    const mapSection = document.querySelector('.wsearch-map-section');
    mapSection.hidden = false;
    setTimeout(() => map.invalidateSize(), 50);
  });

  /* =============================================
     マップのリサイズ対応
  ============================================= */
  window.addEventListener('resize', () => map.invalidateSize());

  /* =============================================
     地域選択モーダル
  ============================================= */
  (function () {
    var overlay   = document.getElementById('regionModal');
    var openBtn   = document.getElementById('regionOpenBtn');
    var closeBtn  = document.getElementById('regionCloseBtn');
    var allBtn    = document.getElementById('regionAllBtn');
    var gridItems = document.querySelectorAll('.wregion-item');

    function openRegionModal() {
      overlay.hidden = false;
      document.body.style.overflow = 'hidden';
      closeBtn.focus();
    }

    function closeRegionModal() {
      overlay.hidden = true;
      document.body.style.overflow = '';
      openBtn.focus();
    }

    openBtn.addEventListener('click', openRegionModal);
    closeBtn.addEventListener('click', closeRegionModal);

    allBtn.addEventListener('click', function () {
      // 全国選択：ここでは単純に閉じる（実装時に絞り込みリセットを追加）
      closeRegionModal();
    });

    gridItems.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var region = btn.dataset.region;
        // 地域選択後の処理をここに追加
        closeRegionModal();
      });
    });

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeRegionModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !overlay.hidden) closeRegionModal();
    });
  })();
  </script>

</body>
