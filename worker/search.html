  <script>
  /* =============================================
     受注者の登録住所（基準地点）
     ※ 実装時はプロフィールDBから取得
  ============================================= */
  const WORKER_HOME = { lat: 34.8897, lng: 136.9370 }; // 愛知県半田市（登録住所）

  // 現在の検索基準地点（初期値＝登録住所、地図移動後に更新）
  let searchCenter = { lat: WORKER_HOME.lat, lng: WORKER_HOME.lng };

  /* =============================================
     距離計算（Haversine 公式、単位：km）
  ============================================= */
  function calcDistance(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function formatDistance(km) {
    return km < 1 ? `${Math.round(km * 1000)}m` : `${km.toFixed(1)}km`;
  }

  /* =============================================
     案件サンプルデータ
  ============================================= */
  const JOBS = [
    {
      id: 1,
      title: '役所等での申請・書類取得',
      price: '¥1,000/件',
      hours: '09:00〜17:00',
      address: '愛知県半田市東洋町2-1',
      period: '2026年04月01日~2026年06月30日',
      daysLeft: 106,
      lat: 34.8897,
      lng: 136.9370,
      img: null
    },
    {
      id: 2,
      title: '共用部清掃_掃き・拭き上げ_6-10世帯',
      price: '¥1,200/件',
      hours: 'いつでも',
      address: '愛知県半田市東大矢知町',
      period: '即日~2026年03月31日',
      daysLeft: 15,
      lat: 34.8850,
      lng: 136.9350,
      img: null
    },
    {
      id: 3,
      title: '駐車場設置のEV充電器アップデート業務',
      price: '¥1,500/件',
      hours: 'いつでも',
      address: '愛知県常滑市 栄町7-108',
      period: '即日~2026年03月29日',
      daysLeft: 13,
      lat: 34.8920,
      lng: 136.8360,
      img: null
    },
    {
      id: 4,
      title: '植栽水やり・軽作業スタッフ募集',
      price: '¥2,000/件',
      hours: 'いつでも',
      address: '愛知県常滑市 栄町7-108',
      period: '即日~2026年03月29日',
      daysLeft: 13,
      lat: 34.8900,
      lng: 136.8400,
      img: null
    },
    {
      id: 5,
      title: 'マンション共用廊下清掃スタッフ',
      price: '¥1,800/件',
      hours: '09:00〜12:00',
      address: '愛知県知多市 新知字弐ノ割',
      period: '即日~2026年04月15日',
      daysLeft: 29,
      lat: 34.9100,
      lng: 136.9200,
      img: null
    }
  ];


  /* =============================================
     Leaflet マップ初期化
  ============================================= */
  const map = L.map('wsearchMap', {
    zoomControl: false,
    center: [WORKER_HOME.lat, WORKER_HOME.lng],
    zoom: 13
  });

  // ズームコントロールを左上に
  L.control.zoom({ position: 'topleft' }).addTo(map);

  // OpenStreetMap タイル
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  // カスタムマーカーアイコン（赤丸に白い＋）
  function createJobIcon(active) {
    return L.divIcon({
      html: `<div class="wsearch-marker${active ? ' wsearch-marker--active' : ''}">+</div>`,
      className: '',
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });
  }

  let activeJobId = JOBS[0].id;
  const markerMap = {};

  function addMarkers() {
    JOBS.forEach(job => {
      const marker = L.marker([job.lat, job.lng], {
        icon: createJobIcon(job.id === activeJobId)
      }).addTo(map);

      marker.on('click', () => {
        selectJob(job.id);
      });

      markerMap[job.id] = marker;
    });
  }

  function updateMarkers() {
    JOBS.forEach(job => {
      if (markerMap[job.id]) {
        markerMap[job.id].setIcon(createJobIcon(job.id === activeJobId));
      }
    });
  }

  addMarkers();

  /* =============================================
     ビュー切り替え共通関数
  ============================================= */
  function showListView() {
    document.getElementById('mapSection').style.display = 'none';
    document.getElementById('listSection').style.display = 'flex';
    renderListItems();
  }

  function showMapView() {
    document.getElementById('listSection').style.display = 'none';
    document.getElementById('mapSection').style.display = '';
    setTimeout(() => map.invalidateSize(), 50);
  }

  /* =============================================
     リストでみる ボタン（インページ切り替え）
  ============================================= */
  document.getElementById('listViewBtn').addEventListener('click', (e) => {
    e.preventDefault();
    // 一覧を開く時点の地図中心を検索基準地点として確定
    const c = map.getCenter();
    searchCenter = { lat: c.lat, lng: c.lng };
    showListView();
  });

  /* =============================================
     地図でみる ボタン
  ============================================= */
  document.getElementById('mapViewBtn').addEventListener('click', showMapView);

  /* =============================================
     リスト表示：案件リストを生成（距離・ソート対応）
  ============================================= */
  function renderListItems() {
    const container = document.getElementById('jobListItems');
    const sortSelect = document.getElementById('listSortSelect');
    const notice = document.getElementById('baseNotice');
    const sortMode = sortSelect ? sortSelect.value : 'distance';

    // 基準地点の表示を更新
    const isHome = searchCenter.lat === WORKER_HOME.lat && searchCenter.lng === WORKER_HOME.lng;
    notice.textContent = isHome
      ? '基準地点：登録住所のエリア'
      : `基準地点：現在の地図中心（地図を動かして「一覧でみる」を押すと更新）`;

    // 距離を付与してソート
    const jobs = JOBS.map(job => ({
      ...job,
      distance: calcDistance(searchCenter.lat, searchCenter.lng, job.lat, job.lng)
    }));

    if (sortMode === 'distance') {
      jobs.sort((a, b) => a.distance - b.distance);
    } else if (sortMode === 'deadline-asc') {
      jobs.sort((a, b) => a.daysLeft - b.daysLeft);
    } else if (sortMode === 'deadline-desc') {
      jobs.sort((a, b) => b.daysLeft - a.daysLeft);
    }

    container.innerHTML = '';

    jobs.forEach(job => {
      const item = document.createElement('div');
      item.className = 'wsearch-list-item';

      const badgeClass = job.daysLeft <= 15
        ? 'wsearch-list-badge--red'
        : 'wsearch-list-badge--gray';

      item.innerHTML = `
        <div class="wsearch-list-thumb">
          <div class="wsearch-list-thumb-inner">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
        </div>
        <div class="wsearch-list-body">
          <div class="wsearch-list-top">
            <span class="wsearch-list-date">${job.period}</span>
            <span class="wsearch-list-badge ${badgeClass}">募集終了まで：あと${job.daysLeft}日</span>
          </div>
          <div class="wsearch-list-title">${job.title}</div>
          <div class="wsearch-list-price">${job.price}</div>
          <div class="wsearch-list-meta">
            <span class="wsearch-list-meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              ${job.hours}
            </span>
            <span class="wsearch-list-meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
              </svg>
              ${job.address}
            </span>
            <span class="wsearch-list-meta-item wsearch-list-distance">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="8 12 12 8 16 12"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
              </svg>
              基準地点から ${formatDistance(job.distance)}
            </span>
          </div>
        </div>
        <div class="wsearch-list-action">
          <a href="detail.html" class="wsearch-list-detail-btn wsearch-list-detail-btn--red">詳細をみる</a>
        </div>
      `;

      container.appendChild(item);
    });
  }

  // ソート変更時に再レンダリング
  document.addEventListener('change', (e) => {
    if (e.target.id === 'listSortSelect') renderListItems();
  });

  /* =============================================
     マップのリサイズ対応
  ============================================= */
  window.addEventListener('resize', () => map.invalidateSize());

  /* =============================================
     地域選択モーダル
  ============================================= */
  (function () {
    var overlay   = document.getElementById('regionModal');
    // var openBtn   = document.getElementById('regionOpenBtn'); // 削除済みボタン
    var closeBtn  = document.getElementById('regionCloseBtn');
    var allBtn    = document.getElementById('regionAllBtn');
    var gridItems = document.querySelectorAll('.wregion-item');

    function closeRegionModal() {
      overlay.hidden = true;
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeRegionModal);

    allBtn.addEventListener('click', function () {
      // 全国選択：ここでは単純に閉じる（実装時に絞り込みリセットを追加）
      closeRegionModal();
    });

    gridItems.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var region = btn.dataset.region;
        // 地域選択後の処理をここに追加
        closeRegionModal();
      });
    });

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeRegionModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !overlay.hidden) closeRegionModal();
    });
  })();
  </script>

</body>
</html>
