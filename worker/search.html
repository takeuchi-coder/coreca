<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案件検索 | ご近所ワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
</head>
<body class="wmypage-body wsearch-body">

  <!-- ===== ログイン中バー ===== -->
  <div class="worker-login-bar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    受注者としてログイン中
  </div>

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">

      <a href="mypage.html" class="header-logo">
        <span class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 3L2 12h3v13h7v-8h4v8h7V12h3L14 3z" fill="#fff"/>
          </svg>
        </span>
        <span class="logo-text">ご近所ワーク</span>
        <span class="logo-role">受注者としてログイン</span>
      </a>

      <nav class="header-nav" aria-label="メインナビゲーション">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="notification.html" class="nav-link">
              <span class="nav-text">通知</span>
            </a>
          </li>
          <li class="nav-item nav-item--active">
            <a href="search.html" class="nav-link">
              <span class="nav-text">案件検索</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="my-list.html" class="nav-link">
              <span class="nav-text">案件一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="reward.html" class="nav-link">
              <span class="nav-text">報酬情報</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="messages.html" class="nav-link">
              <span class="nav-text">メッセージ一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">お問い合わせ</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">ご利用マニュアル</span>
            </a>
          </li>
        </ul>

        <!-- 右側アクション -->
        <div class="nav-actions">
          <!-- エリア選択 -->
          <div class="wmypage-area-select">
            <select class="wmypage-area-dropdown" aria-label="エリアを選択">
              <option value="tokyo">東京都版</option>
              <option value="saitama">埼玉県版</option>
              <option value="kanagawa">神奈川県版</option>
              <option value="chiba">千葉県版</option>
            </select>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="wmypage-area-chevron">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <!-- アカウント情報アイコン -->
          <a href="mypage.html" class="nav-user" aria-label="アカウント情報">
            <span class="header-avatar-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
          </a>
        </div>
      </nav>

    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- ===== 検索コントロール ===== -->
  <section class="wsearch-controls">
    <div class="wsearch-controls-inner">

      <!-- 左：日付タイトル＋フィルター -->
      <div class="wsearch-left">
        <h1 class="wsearch-date-title" id="searchDateTitle">2025年12月2日のお仕事</h1>
        <div class="wsearch-filter-row">
          <!-- 応募可のみ トグル -->
          <label class="wsearch-toggle-wrap">
            <span class="wsearch-toggle-text">応募可のみ</span>
            <span class="wsearch-toggle">
              <input type="checkbox" id="availableOnly" checked>
              <span class="wsearch-toggle-slider"></span>
            </span>
          </label>
          <!-- 在宅ワーク ボタン -->
          <button class="wsearch-remote-btn" id="remoteBtn">在宅ワーク</button>
        </div>
      </div>

      <!-- 右：カレンダー（曜日＋日付ナビ） -->
      <div class="wsearch-right">
        <div class="wsearch-calendar">
          <div class="wsearch-weekdays">
            <span class="wsearch-wd">日</span>
            <span class="wsearch-wd">月</span>
            <span class="wsearch-wd">火</span>
            <span class="wsearch-wd">水</span>
            <span class="wsearch-wd">木</span>
            <span class="wsearch-wd">金</span>
            <span class="wsearch-wd wsearch-wd--sat">土</span>
          </div>
          <div class="wsearch-date-row">
            <button class="wsearch-nav-btn" id="prevWeek" aria-label="前の週">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div class="wsearch-dates" id="dateList"></div>
            <button class="wsearch-nav-btn" id="nextWeek" aria-label="次の週">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>
      </div>

    </div>
  </section>
  <!-- ===== /検索コントロール ===== -->

  <!-- ===== マップセクション ===== -->
  <div class="wsearch-map-section">

    <!-- Leaflet マップ -->
    <div id="wsearchMap" class="wsearch-map"></div>

    <!-- リストでみる ボタン -->
    <button class="wsearch-list-btn" id="listViewBtn" aria-label="リスト表示に切り替え">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      リストでみる
    </button>

    <!-- 案件カードカルーセル -->
    <div class="wsearch-carousel" id="jobCarousel">
      <button class="wsearch-carousel-arrow wsearch-carousel-arrow--prev" id="carouselPrev" aria-label="前の案件">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div class="wsearch-cards-viewport">
        <div class="wsearch-cards" id="jobCards">
          <!-- カードは JavaScript で生成 -->
        </div>
      </div>

      <button class="wsearch-carousel-arrow wsearch-carousel-arrow--next" id="carouselNext" aria-label="次の案件">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

  </div>
  <!-- ===== /マップセクション ===== -->

  <!-- ===== フッター ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>
          <li><a href="#">利用規約</a></li>
          <li><a href="#">プライバシーポリシー</a></li>
          <li><a href="#">運営会社</a></li>
          <li><a href="#">お仕事依頼したい方はこちら</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 2020 gokinjowork Inc.</p>
    </div>
  </footer>
  <!-- ===== /フッター ===== -->

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WPbM=" crossorigin=""></script>

  <script>
  /* =============================================
     案件サンプルデータ
  ============================================= */
  const JOBS = [
    {
      id: 1,
      title: '共用部清掃_掃きのみ_26-30...',
      price: '¥1800/件',
      address: '港区港南区4-2-27',
      period: '即日〜12月02日(火)',
      daysLeft: 1,
      lat: 35.6762,
      lng: 139.7303,
      img: null
    },
    {
      id: 2,
      title: 'ゴミ出し〜20代女性歓迎',
      price: '¥1100/件',
      address: '世田谷区岡本2-14-10',
      period: '即日〜12月05日(金)',
      daysLeft: 3,
      lat: 35.6628,
      lng: 139.6394,
      img: null
    },
    {
      id: 3,
      title: 'レンタルスペース清掃スタッフ',
      price: '¥1000/件',
      address: '千代田区神田より徒歩2分',
      period: '即日〜12月08日(月)',
      daysLeft: 6,
      lat: 35.6938,
      lng: 139.7636,
      img: null
    },
    {
      id: 4,
      title: 'マンション共用廊下清掃',
      price: '¥1500/件',
      address: '新宿区西新宿3-7-1',
      period: '即日〜12月10日(水)',
      daysLeft: 8,
      lat: 35.6930,
      lng: 139.6923,
      img: null
    },
    {
      id: 5,
      title: '植栽水やり・軽作業スタッフ',
      price: '¥2000/件',
      address: '渋谷区代々木1-1-5',
      period: '即日〜12月12日(金)',
      daysLeft: 10,
      lat: 35.6840,
      lng: 139.7020,
      img: null
    }
  ];

  /* =============================================
     日付ピッカー
  ============================================= */
  const today = new Date(2025, 11, 2); // 2025-12-02（画像に合わせる）
  let selectedDate = new Date(today);
  let weekOffset = 0; // 0: 今週基準

  const WEEKDAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];
  const WEEKDAY_SHORT = ['(日)', '(月)', '(火)', '(水)', '(木)', '(金)', '(土)'];

  function getWeekStart(base, offset) {
    // 今日の曜日から日曜日を起点とした週の開始日を計算
    const d = new Date(base);
    d.setDate(d.getDate() - d.getDay() + offset * 7);
    return d;
  }

  function renderCalendar() {
    const list = document.getElementById('dateList');
    const titleEl = document.getElementById('searchDateTitle');
    list.innerHTML = '';

    const weekStart = getWeekStart(today, weekOffset);

    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart);
      d.setDate(weekStart.getDate() + i);

      const cell = document.createElement('button');
      cell.className = 'wsearch-date-cell';
      cell.textContent = d.getDate();

      // 土曜日
      if (i === 6) cell.classList.add('wsearch-date-cell--sat');
      // 日曜日
      if (i === 0) cell.classList.add('wsearch-date-cell--sun');
      // 前月 / 翌月
      if (d.getMonth() !== today.getMonth()) cell.classList.add('wsearch-date-cell--other');
      // 選択中
      if (d.toDateString() === selectedDate.toDateString()) {
        cell.classList.add('wsearch-date-cell--active');
      }

      cell.addEventListener('click', () => {
        selectedDate = new Date(d);
        renderCalendar();
        updateTitle();
        updateMarkers();
      });

      list.appendChild(cell);
    }
  }

  function updateTitle() {
    const el = document.getElementById('searchDateTitle');
    const m = selectedDate.getMonth() + 1;
    const day = selectedDate.getDate();
    const wd = WEEKDAY_NAMES[selectedDate.getDay()];
    el.textContent = `${selectedDate.getFullYear()}年${m}月${day}日(${wd})のお仕事`;
  }

  document.getElementById('prevWeek').addEventListener('click', () => {
    weekOffset--;
    renderCalendar();
  });
  document.getElementById('nextWeek').addEventListener('click', () => {
    weekOffset++;
    renderCalendar();
  });

  renderCalendar();
  updateTitle();

  /* =============================================
     在宅ワークボタン トグル
  ============================================= */
  const remoteBtn = document.getElementById('remoteBtn');
  remoteBtn.addEventListener('click', () => {
    remoteBtn.classList.toggle('wsearch-remote-btn--active');
  });

  /* =============================================
     Leaflet マップ初期化
  ============================================= */
  const map = L.map('wsearchMap', {
    zoomControl: false,
    center: [35.6762, 139.6503],
    zoom: 13
  });

  // ズームコントロールを左上に
  L.control.zoom({ position: 'topleft' }).addTo(map);

  // OpenStreetMap タイル
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  // カスタムマーカーアイコン（赤丸に白い＋）
  function createJobIcon(active) {
    return L.divIcon({
      html: `<div class="wsearch-marker${active ? ' wsearch-marker--active' : ''}">+</div>`,
      className: '',
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });
  }

  let activeJobId = JOBS[0].id;
  const markerMap = {};

  function addMarkers() {
    JOBS.forEach(job => {
      const marker = L.marker([job.lat, job.lng], {
        icon: createJobIcon(job.id === activeJobId)
      }).addTo(map);

      marker.on('click', () => {
        selectJob(job.id);
      });

      markerMap[job.id] = marker;
    });
  }

  function updateMarkers() {
    JOBS.forEach(job => {
      if (markerMap[job.id]) {
        markerMap[job.id].setIcon(createJobIcon(job.id === activeJobId));
      }
    });
  }

  addMarkers();

  /* =============================================
     案件カードカルーセル
  ============================================= */
  function renderCards() {
    const container = document.getElementById('jobCards');
    container.innerHTML = '';

    JOBS.forEach(job => {
      const card = document.createElement('div');
      card.className = 'wsearch-card' + (job.id === activeJobId ? ' wsearch-card--active' : '');
      card.dataset.jobId = job.id;

      // バッジの色：あと1日は赤、それ以上はオレンジ系
      const badgeClass = job.daysLeft <= 1 ? 'wsearch-card-badge--urgent' : 'wsearch-card-badge--soon';

      card.innerHTML = `
        <div class="wsearch-card-img">
          <div class="wsearch-card-img-placeholder">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
        </div>
        <div class="wsearch-card-body">
          <div class="wsearch-card-period">${job.period}</div>
          <div class="wsearch-card-badge ${badgeClass}">募集期間：あと${job.daysLeft}日</div>
          <div class="wsearch-card-title">${job.title}</div>
          <div class="wsearch-card-price">${job.price}</div>
          <div class="wsearch-card-addr">${job.address}</div>
        </div>
      `;

      card.addEventListener('click', () => selectJob(job.id));
      container.appendChild(card);
    });
  }

  function selectJob(jobId) {
    activeJobId = jobId;
    renderCards();
    updateMarkers();

    // 選択した案件のカードまでスクロール
    const activeCard = document.querySelector('.wsearch-card--active');
    if (activeCard) {
      activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    // マップを案件の位置に移動
    const job = JOBS.find(j => j.id === jobId);
    if (job) {
      map.panTo([job.lat, job.lng], { animate: true });
    }
  }

  renderCards();

  // カルーセル 矢印ナビ
  const viewport = document.querySelector('.wsearch-cards-viewport');
  const CARD_WIDTH = 256; // px (card width + gap)

  document.getElementById('carouselPrev').addEventListener('click', () => {
    viewport.scrollBy({ left: -CARD_WIDTH, behavior: 'smooth' });
  });
  document.getElementById('carouselNext').addEventListener('click', () => {
    viewport.scrollBy({ left: CARD_WIDTH, behavior: 'smooth' });
  });

  /* =============================================
     リストでみる ボタン
  ============================================= */
  document.getElementById('listViewBtn').addEventListener('click', () => {
    // 将来的なリスト表示ページへの遷移
    alert('リスト表示は準備中です。');
  });

  /* =============================================
     マップのリサイズ対応
  ============================================= */
  window.addEventListener('resize', () => map.invalidateSize());
  </script>

</body>
</html>
