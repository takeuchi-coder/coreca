<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | コレカらワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
  <style>
    .login-error-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #fff5f5;
      border: 1px solid #f5c6c6;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #c0392b;
      font-size: 14px;
      line-height: 1.5;
    }
    .login-error-banner svg {
      flex-shrink: 0;
      margin-top: 1px;
    }
    .worker-input--error {
      border-color: #e8192c !important;
      background: #fff8f8;
    }
    .worker-input--error:focus {
      outline-color: #e8192c;
      box-shadow: 0 0 0 3px rgba(232, 25, 44, 0.15);
    }
  </style>
</head>
<body class="worker-body">

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">

      <a href="../index.html" class="header-logo">
        <img src="../images/logo.png" alt="コレからワーク" class="header-logo-img">
      </a>

      <nav class="header-nav" aria-label="メインナビゲーション">
        <ul class="nav-list"></ul>
        <div class="nav-actions">
        </div>
      </nav>

    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- ===== メインコンテンツ ===== -->
  <main class="worker-main">
    <div class="worker-card">

      <!-- ページタイトル -->
      <h1 class="worker-page-title">ログイン</h1>
      <hr class="worker-title-rule">

      <!-- エラーメッセージ -->
      <div class="login-error-banner" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>メールアドレスまたはパスワードが正しくありません。<br>ご確認のうえ、もう一度お試しください。</span>
      </div>

      <!-- フォーム -->
      <form class="worker-form worker-form--login" action="#" method="post">

        <!-- メールアドレス -->
        <div class="worker-form-group">
          <label class="worker-label" for="email">メールアドレス</label>
          <input
            class="worker-input worker-input--error"
            type="email"
            id="email"
            name="email"
            placeholder="メールアドレスを入力してください"
            autocomplete="email"
            value="example@example.com"
          >
        </div>

        <hr class="worker-field-rule">

        <!-- パスワード -->
        <div class="worker-form-group">
          <label class="worker-label" for="password">パスワード</label>
          <input
            class="worker-input worker-input--error"
            type="password"
            id="password"
            name="password"
            placeholder="パスワードを入力してください"
            autocomplete="current-password"
          >
        </div>

        <!-- ログインボタン -->
        <div class="worker-btn-wrap">
          <button type="submit" class="btn-worker-login">ログイン</button>
        </div>

        <!-- リンク群 -->
        <div class="worker-form-links">
          <a href="password-reset.html" class="worker-text-link">パスワードを忘れた方はこちら</a>
          <a href="register.html" class="worker-text-link">無料会員登録はこちら</a>
        </div>

      </form>

    </div>
  </main>
  <!-- ===== /メインコンテンツ ===== -->

  <script>
    document.querySelector('.worker-form--login').addEventListener('submit', function (e) {
      e.preventDefault();
      location.href = 'mypage.html';
    });
  </script>

  <!-- ===== フッター ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>
          <li><a href="#">利用規約</a></li>
          <li><a href="#">プライバシーポリシー</a></li>
          <li><a href="#">運営会社</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 2020 gokinjowork Inc.</p>
    </div>
  </footer>
  <!-- ===== /フッター ===== -->

</body>
</html>
