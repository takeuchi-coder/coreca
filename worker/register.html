<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無料会員登録 | コレカらワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
</head>
<body class="worker-body">

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">

      <a href="../index.html" class="header-logo">
        <img src="../images/logo.png" alt="コレからワーク" class="header-logo-img">
      </a>

      <nav class="header-nav" id="headerNav" aria-label="メインナビゲーション">
        <ul class="nav-list"></ul>
        <div class="nav-actions">
        </div>
      </nav>

      <!-- ハンバーガーメニュー（モバイル用） -->
      <button class="hamburger" id="hamburgerBtn" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- ===== メインコンテンツ ===== -->
  <main class="worker-main">
    <div class="worker-card">

      <!-- ページタイトル -->
      <h1 class="worker-page-title">無料会員登録</h1>
      <hr class="worker-title-rule">

      <!-- リード文 -->
      <p class="worker-lead">ご入力いただいたメールアドレスで登録いたします。</p>

      <!-- フォーム -->
      <form class="worker-form" action="profile.html" method="get">

        <div class="worker-form-group">
          <label class="worker-label" for="email">メールアドレス</label>
          <input
            class="worker-input"
            type="email"
            id="email"
            name="email"
            placeholder="メールアドレスを入力してください"
            autocomplete="email"
          >
        </div>

        <button type="submit" class="btn-worker-primary">次へ</button>

        <div class="worker-login-link-wrap">
          <a href="login.html" class="worker-login-link">ログイン</a>
        </div>

      </form>

      <!-- 注意書き -->
      <div class="worker-notice">
        <p>
          メールの受信設定を確認してください。<br>
          迷惑メールフィルターを設定されている場合は、「@corecara-work.com」からのメールが受信できるようにご設定をお願い致します。または、迷惑メールとして認識されている可能性がありますので、迷惑メールフォルダをご確認ください。
        </p>
      </div>

    </div>
  </main>
  <!-- ===== /メインコンテンツ ===== -->

  <!-- ===== フッター（共通） ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>
          <li><a href="#">利用規約</a></li>
          <li><a href="#">プライバシーポリシー</a></li>
          <li><a href="#">運営会社</a></li>
          <li><a href="#">お仕事をお探しの方はこちら</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 株式会社コレカ</p>
    </div>
  </footer>
  <!-- ===== /フッター ===== -->

  <script>
    (function () {
      var h = document.getElementById("hamburgerBtn");
      var n = document.getElementById("headerNav");
      if (h && n) h.addEventListener("click", function () { n.classList.toggle("is-open"); });
    })();
  </script>
</body>
</html>
