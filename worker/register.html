<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無料会員登録（お仕事をお探しの方）| ご近所ワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
</head>
<body class="worker-body">

  <!-- ===== ヘッダー（受注者用・シンプル） ===== -->
  <header class="worker-header">
    <div class="worker-header-inner">
      <a href="index.html" class="worker-logo">
        <span class="worker-logo-icon">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 3L2 12h3v13h7v-8h4v8h7V12h3L14 3z" fill="#e8192c"/>
          </svg>
        </span>
        <span class="worker-logo-text">ご近所ワーク</span>
      </a>

      <a href="login.html" class="worker-header-login">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>ログイン</span>
      </a>
    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- ===== メインコンテンツ ===== -->
  <main class="worker-main">
    <div class="worker-card">

      <!-- ページタイトル -->
      <h1 class="worker-page-title">無料会員登録（お仕事をお探しの方）</h1>
      <hr class="worker-title-rule">

      <!-- リード文 -->
      <p class="worker-lead">ご入力いただいたメールアドレスで登録いたします。</p>

      <!-- フォーム -->
      <form class="worker-form" action="#" method="post">

        <div class="worker-form-group">
          <label class="worker-label" for="email">メールアドレス</label>
          <input
            class="worker-input"
            type="email"
            id="email"
            name="email"
            placeholder="メールアドレスを入力してください"
            autocomplete="email"
          >
        </div>

        <button type="submit" class="btn-worker-primary">次へ</button>

        <div class="worker-login-link-wrap">
          <a href="login.html" class="worker-login-link">ログイン（お仕事をお探しの方）</a>
        </div>

      </form>

      <!-- 注意書き -->
      <div class="worker-notice">
        <p>
          メールの受信設定を確認してください。<br>
          迷惑メールフィルターを設定されている場合は、「@gokinjowork.jp」からのメールが受信できるようにご設定をお願い致します。または、迷惑メールとして認識されている可能性がありますので、迷惑メールフォルダをご確認ください。
        </p>
      </div>

    </div>
  </main>
  <!-- ===== /メインコンテンツ ===== -->

  <!-- ===== フッター（共通） ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>
          <li><a href="#">利用規約</a></li>
          <li><a href="#">プライバシーポリシー</a></li>
          <li><a href="#">運営会社</a></li>
          <li><a href="#">お仕事をお探しの方はこちら</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 2020 gokinjowork Inc.</p>
    </div>
  </footer>
  <!-- ===== /フッター ===== -->

</body>
</html>
