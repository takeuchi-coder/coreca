<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ（送信完了） | ご近所ワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
</head>
<body class="wmypage-body wcontact-body">

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">

      <a href="../index.html" class="header-logo">
        <img src="../images/logo.png" alt="コレからワーク" class="header-logo-img">
      </a>

      <nav class="header-nav" aria-label="メインナビゲーション">
        <ul class="nav-list">
          <li class="nav-item"><a href="mypage.html" class="nav-link"><span class="nav-text">マイページ</span></a></li>
          <li class="nav-item">
            <a href="search.html" class="nav-link"><span class="nav-text">案件検索</span></a>
          </li>
          <li class="nav-item">
            <a href="my-list.html" class="nav-link"><span class="nav-text">案件一覧</span></a>
          </li>
          <li class="nav-item">
            <a href="reward.html" class="nav-link"><span class="nav-text">報酬情報</span></a>
          </li>
          <li class="nav-item">
            <a href="messages.html" class="nav-link"><span class="nav-text">メッセージ一覧</span></a>
          </li>
          <li class="nav-item">
            <a href="contact.html" class="nav-link nav-link--active"><span class="nav-text">お問い合わせ</span></a>
          </li>
          <li class="nav-item">
            <a href="manual.html" class="nav-link"><span class="nav-text">ご利用マニュアル</span></a>
          </li>
        </ul>

        <div class="nav-actions">
          <a href="mypage.html" class="nav-user" aria-label="アカウント情報">
            <span class="header-avatar-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
          </a>
        </div>
      </nav>

    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- ===== メインコンテンツ ===== -->
  <main class="wcontact-main">
    <div class="wcontact-inner">

      <h1 class="wcontact-heading">お問い合わせフォーム</h1>

      <!-- フォームカード -->
      <div class="wcontact-card">

        <!-- ステッパー -->
        <div class="wcontact-stepper">
          <div class="wcontact-step wcontact-step--active">
            <div class="wcontact-step-circle wcontact-step-circle--done">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <div class="wcontact-step-line wcontact-step-line--active"></div>
          </div>
          <div class="wcontact-step wcontact-step--active">
            <div class="wcontact-step-circle wcontact-step-circle--done">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <div class="wcontact-step-line wcontact-step-line--active"></div>
          </div>
          <div class="wcontact-step">
            <div class="wcontact-step-circle wcontact-step-circle--current">3</div>
          </div>
        </div>
        <div class="wcontact-stepper-labels">
          <div class="wcontact-stepper-label wcontact-stepper-label--done">
            <span class="wcontact-stepper-title">お問い合わせ</span>
          </div>
          <div class="wcontact-stepper-label wcontact-stepper-label--done">
            <span class="wcontact-stepper-title">確認</span>
          </div>
          <div class="wcontact-stepper-label wcontact-stepper-label--active">
            <span class="wcontact-stepper-title">送信完了</span>
          </div>
        </div>

        <!-- 送信完了メッセージ -->
        <div class="wcontact-complete">
          <div class="wcontact-complete-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="20 6 9 17 4 12" stroke-width="2.5"/>
            </svg>
          </div>
          <h2 class="wcontact-complete-title">送信が完了しました</h2>
          <p class="wcontact-complete-text">
            お問い合わせいただきありがとうございます。<br>
            内容を確認のうえ、担当者よりご連絡いたします。<br>
            しばらくお待ちください。
          </p>
          <a href="mypage.html" class="wcontact-btn-confirm">
            マイページへ戻る
          </a>
        </div>

      </div><!-- /wcontact-card -->

    </div>
  </main>
  <!-- ===== /メインコンテンツ ===== -->

  <!-- ===== フッター ===== -->
  <footer class="wcontact-footer">
    <p class="wcontact-footer-text">&copy;Toyokumo, Inc.&nbsp;&nbsp;&nbsp;FormBridge&nbsp;&nbsp;Ver.1.40.37</p>
  </footer>

</body>
</html>
