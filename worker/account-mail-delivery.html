  <link rel="stylesheet" href="../css/worker.css">
</head>
<body class="wmypage-body wbasic-body">

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">

      <a href="mypage.html" class="header-logo">
        <span class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 3L2 12h3v13h7v-8h4v8h7V12h3L14 3z" fill="#fff"/>
          </svg>
        </span>
        <span class="logo-text">ご近所ワーク</span>
        <span class="logo-role">受注者としてログイン</span>
      </a>

      <nav class="header-nav" aria-label="メインナビゲーション">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="notification.html" class="nav-link"><span class="nav-text">通知</span></a>
          </li>
          <li class="nav-item">
            <a href="search.html" class="nav-link"><span class="nav-text">案件検索</span></a>
          </li>
          <li class="nav-item">
            <a href="my-list.html" class="nav-link"><span class="nav-text">案件一覧</span></a>
          </li>
          <li class="nav-item">
            <a href="reward.html" class="nav-link"><span class="nav-text">報酬情報</span></a>
          </li>
          <li class="nav-item">
            <a href="messages.html" class="nav-link"><span class="nav-text">メッセージ一覧</span></a>
          </li>
          <li class="nav-item">
            <a href="contact.html" class="nav-link"><span class="nav-text">お問い合わせ</span></a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link"><span class="nav-text">ご利用マニュアル</span></a>
          </li>
        </ul>

        <div class="nav-actions">
          <div class="wmypage-area-select">
            <select class="wmypage-area-dropdown" aria-label="エリアを選択">
              <option value="tokyo">東京都版</option>
              <option value="saitama">埼玉県版</option>
              <option value="kanagawa">神奈川県版</option>
              <option value="chiba">千葉県版</option>
            </select>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="wmypage-area-chevron">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <a href="mypage.html" class="nav-user" aria-label="アカウント情報">
            <span class="header-avatar-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>

    </div>

  <!-- ===== /ヘッダー ===== -->

  <!-- ===== メインコンテンツ ===== -->
  <main class="wbasic-main">
    <div class="wbasic-inner">

      <!-- ページタイトル行 -->
      <div class="wbasic-title-row">
        <a href="mypage.html" class="wbasic-back-link" aria-label="戻る">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </a>
        <h1 class="wbasic-title">メール配信</h1>
      </div>
      <hr class="wbasic-title-rule">

      <!-- フォームカード -->
      <div class="wbasic-card">
        <form id="mailDeliveryForm">

          <!-- お仕事紹介メール -->
          <div class="wbasic-row">
            <div class="wbasic-label-col">
              <span class="wbasic-label">お仕事紹介メール</span>
              <span class="wbasic-badge-required">必須</span>
            </div>
            <div class="wbasic-field-col">
              <div class="wbasic-radio-group">
                <label class="wbasic-radio-label">
                  <input type="radio" name="mailDelivery" value="receive" checked> 受け取る
                </label>
                <label class="wbasic-radio-label">
                  <input type="radio" name="mailDelivery" value="reject"> 受け取らない
                </label>
              </div>
            </div>
          </div>

          <!-- 保存ボタン -->
          <div class="wbasic-submit-row">
            <button type="submit" class="wbasic-btn-submit wbasic-btn-submit--wide">保存する</button>
          </div>

        </form>
      </div>

    </div>
  </main>
  <!-- ===== /メインコンテンツ ===== -->
