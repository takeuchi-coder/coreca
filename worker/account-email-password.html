        <a href="mypage.html" class="wbasic-back-link" aria-label="戻る">

        <h1 class="wbasic-title">メールアドレス・パスワード変更</h1>
      </div>
      <hr class="wbasic-title-rule">

      <!-- メールアドレス変更 -->
      <div class="wbasic-card">
        <div class="wbasic-row">
          <div class="wbasic-label-col">
            <span class="wbasic-label">メールアドレス</span>
          </div>
          <div class="wbasic-field-col wbasic-field-col--email">
            <input class="wbasic-input wbasic-input--email-readonly" type="email" value="kawabe-mi@coreca.co.jp" readonly>
          </div>
        </div>
        <div class="wbasic-submit-row">
          <button type="button" class="wbasic-btn-submit">変更する</button>
        </div>
      </div>

      <!-- パスワード変更 -->
      <div class="wbasic-card">
        <div class="wbasic-row">
          <div class="wbasic-label-col">
            <span class="wbasic-label">新パスワード</span>
          </div>
          <div class="wbasic-field-col">
            <input class="wbasic-input wbasic-input--password" type="password" id="newPassword" name="newPassword" placeholder="" autocomplete="new-password">
            <div class="wbasic-hint">英数字6文字以上16文字以内で入力してください。</div>
          </div>
        </div>
        <hr class="wbasic-row-rule">
        <div class="wbasic-row">
          <div class="wbasic-label-col">
            <span class="wbasic-label">新パスワード確認用</span>
          </div>
          <div class="wbasic-field-col">
            <input class="wbasic-input wbasic-input--password" type="password" id="confirmPassword" name="confirmPassword" placeholder="" autocomplete="new-password">
          </div>
        </div>
        <div class="wbasic-submit-row">
          <button type="button" class="wbasic-btn-submit">変更する</button>
        </div>
      </div>
