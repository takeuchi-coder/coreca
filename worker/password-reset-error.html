<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定 | コレカらワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
  <style>
    .wpr-error-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #fff5f5;
      border: 1px solid #f5c6c6;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #c0392b;
      font-size: 14px;
      line-height: 1.5;
    }
    .wpr-error-banner svg {
      flex-shrink: 0;
      margin-top: 1px;
    }
    .worker-input--error {
      border-color: #e8192c !important;
      background: #fff8f8;
    }
    .worker-input--error:focus {
      outline-color: #e8192c;
      box-shadow: 0 0 0 3px rgba(232, 25, 44, 0.15);
    }
  </style>
</head>
<body class="worker-body">

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">

      <a href="../index.html" class="header-logo">
        <img src="../images/logo.png" alt="コレからワーク" class="header-logo-img">
      </a>

      <nav class="header-nav" id="headerNav" aria-label="メインナビゲーション">
        <ul class="nav-list"></ul>
        <div class="nav-actions">
          <a href="login.html" class="worker-header-login" aria-label="ログイン">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            ログイン
          </a>
        </div>
      </nav>

      <!-- ハンバーガーメニュー（モバイル用） -->
      <button class="hamburger" id="hamburgerBtn" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- ===== メインコンテンツ ===== -->
  <main class="worker-main">
    <div class="worker-card worker-card--wide">

      <!-- ページタイトル -->
      <h1 class="worker-page-title">パスワード再設定</h1>
      <hr class="worker-title-rule">

      <!-- フォームビュー -->
      <div id="wpr-form-view">

        <!-- エラーメッセージ -->
        <div class="wpr-error-banner" role="alert">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>メールアドレスの形式が正しくありません。<br>正しいメールアドレスを入力してください。</span>
        </div>

        <form class="wpr-form" id="wprForm" action="#" method="post" novalidate>

          <div class="worker-form-group">
            <label class="worker-label" for="email">メールアドレス</label>
            <input
              class="worker-input wpr-email-input worker-input--error"
              type="email"
              id="email"
              name="email"
              placeholder="メールアドレスを入力してください"
              autocomplete="email"
              value="invalid-email"
              required
            >
          </div>

          <!-- 送信ボタン -->
          <div class="worker-btn-wrap wpr-btn-wrap">
            <button type="submit" class="btn-worker-login">送信する</button>
          </div>

        </form>

        <!-- 注意書き -->
        <div class="wpr-note-box">
          パスワード再設定用URLが記載されたメールを送信いたします。ご登録がないメールアドレス、認証していないメールアドレスを入力した場合、メールは送信されません。
        </div>

      </div>
      <!-- /フォームビュー -->

    </div>
  </main>
  <!-- ===== /メインコンテンツ ===== -->

  <!-- ===== フッター ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>
          <li><a href="#">利用規約</a></li>
          <li><a href="#">プライバシーポリシー</a></li>
          <li><a href="#">運営会社</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 株式会社コレカ</p>
    </div>
  </footer>
  <!-- ===== /フッター ===== -->

  <script>
    document.getElementById('wprForm').addEventListener('submit', function (e) {
      e.preventDefault();
      location.href = 'password-reset-sent.html';
    });
  </script>

  <script>
    (function () {
      var h = document.getElementById("hamburgerBtn");
      var n = document.getElementById("headerNav");
      if (h && n) h.addEventListener("click", function () { n.classList.toggle("is-open"); });
    })();
  </script>
</body>
</html>
