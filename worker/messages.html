<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メッセージ一覧 | ご近所ワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
</head>
<body class="wmypage-body wmsg-body">

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">

      <a href="mypage.html" class="header-logo">
        <span class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 3L2 12h3v13h7v-8h4v8h7V12h3L14 3z" fill="#fff"/>
          </svg>
        </span>
        <span class="logo-text">ご近所ワーク</span>
        <span class="logo-role">受注者としてログイン</span>
      </a>

      <nav class="header-nav" aria-label="メインナビゲーション">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="notification.html" class="nav-link">
              <span class="nav-text">通知</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="search.html" class="nav-link">
              <span class="nav-text">案件検索</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="my-list.html" class="nav-link">
              <span class="nav-text">案件一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="reward.html" class="nav-link">
              <span class="nav-text">報酬情報</span>
            </a>
          </li>
          <li class="nav-item nav-item--active">
            <a href="messages.html" class="nav-link">
              <span class="nav-text">メッセージ一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">お問い合わせ</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">ご利用マニュアル</span>
            </a>
          </li>
        </ul>

        <div class="nav-actions">
          <div class="wmypage-area-select">
            <select class="wmypage-area-dropdown" aria-label="エリアを選択">
              <option value="tokyo">東京都版</option>
              <option value="saitama">埼玉県版</option>
              <option value="kanagawa">神奈川県版</option>
              <option value="chiba">千葉県版</option>
            </select>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="wmypage-area-chevron">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <a href="mypage.html" class="nav-user" aria-label="アカウント情報">
            <span class="header-avatar-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
          </a>
        </div>
      </nav>

    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- ===== メインコンテンツ ===== -->
  <main class="wmsg-main">
    <div class="wmsg-inner">

      <!-- ページタイトル -->
      <h1 class="wmsg-title">メッセージ一覧</h1>
      <hr class="wmsg-title-rule">

      <!-- 件数バー + フィルター -->
      <div class="wmsg-toolbar">
        <div class="wmsg-count-row">
          <span class="wmsg-count-num">0</span>
          <span class="wmsg-count-text">件中 〜 件表示</span>
          <div class="wmsg-per-page-select">
            <select class="wmsg-per-page-dropdown" aria-label="表示件数">
              <option value="10">10件</option>
              <option value="20">20件</option>
              <option value="50">50件</option>
            </select>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="wmsg-per-page-chevron">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>
        <div class="wmsg-filter-btns">
          <button class="wmsg-filter-btn wmsg-filter-btn--active">全て</button>
          <button class="wmsg-filter-btn">未読のみ</button>
          <button class="wmsg-filter-btn wmsg-filter-btn--search">詳細検索</button>
        </div>
      </div>

      <!-- 空状態 -->
      <div class="wmsg-empty">
        <p>該当するメッセージがありません。</p>
      </div>

    </div>
  </main>
  <!-- ===== /メインコンテンツ ===== -->

  <!-- ===== 絞り込み検索モーダル ===== -->
  <div class="wmsg-modal-overlay" id="searchModal" role="dialog" aria-modal="true" aria-labelledby="searchModalTitle" hidden>
    <div class="wmsg-modal">

      <!-- モーダルヘッダー -->
      <div class="wmsg-modal-header">
        <h2 class="wmsg-modal-title" id="searchModalTitle">絞り込み条件</h2>
        <button class="wmsg-modal-close" id="searchModalClose" aria-label="閉じる">&times;</button>
      </div>
      <hr class="wmsg-modal-rule">

      <!-- フォーム -->
      <form class="wmsg-modal-form" id="searchForm">
        <div class="wmsg-modal-field">
          <label class="wmsg-modal-label" for="filterOrderer">発注者名</label>
          <input class="wmsg-modal-input" type="text" id="filterOrderer" name="orderer">
        </div>
        <div class="wmsg-modal-field">
          <label class="wmsg-modal-label" for="filterJobId">案件ID</label>
          <input class="wmsg-modal-input" type="text" id="filterJobId" name="jobId">
        </div>
        <div class="wmsg-modal-field">
          <label class="wmsg-modal-label" for="filterCourse">コース名</label>
          <input class="wmsg-modal-input" type="text" id="filterCourse" name="course">
        </div>
        <div class="wmsg-modal-field">
          <label class="wmsg-modal-label" for="filterAddress">案件住所</label>
          <input class="wmsg-modal-input" type="text" id="filterAddress" name="address">
        </div>
        <div class="wmsg-modal-field wmsg-modal-field--check">
          <label class="wmsg-modal-label" for="filterUnread">メッセージ未読</label>
          <input class="wmsg-modal-checkbox" type="checkbox" id="filterUnread" name="unread">
        </div>

        <!-- ボタン行 -->
        <div class="wmsg-modal-actions">
          <button class="wmsg-modal-btn-clear" type="button" id="searchFormClear">クリア</button>
          <button class="wmsg-modal-btn-submit" type="submit">絞り込む</button>
        </div>
      </form>

    </div>
  </div>
  <!-- ===== /絞り込み検索モーダル ===== -->

  <!-- ===== フッター ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>
          <li><a href="#">利用規約</a></li>
          <li><a href="#">プライバシーポリシー</a></li>
          <li><a href="#">運営会社</a></li>
          <li><a href="#">お仕事依頼したい方はこちら</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 2020 gokinjowork Inc.</p>
    </div>
  </footer>

  <script>
    (function () {
      var overlay  = document.getElementById('searchModal');
      var openBtn  = document.querySelector('.wmsg-filter-btn--search');
      var closeBtn = document.getElementById('searchModalClose');
      var clearBtn = document.getElementById('searchFormClear');
      var form     = document.getElementById('searchForm');

      function openModal() {
        overlay.hidden = false;
        document.body.style.overflow = 'hidden';
        closeBtn.focus();
      }

      function closeModal() {
        overlay.hidden = true;
        document.body.style.overflow = '';
        openBtn.focus();
      }

      openBtn.addEventListener('click', openModal);
      closeBtn.addEventListener('click', closeModal);

      // オーバーレイ背景クリックで閉じる
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeModal();
      });

      // Escape キーで閉じる
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !overlay.hidden) closeModal();
      });

      // クリアボタン
      clearBtn.addEventListener('click', function () {
        form.reset();
      });
    })();
  </script>

</body>
</html>
