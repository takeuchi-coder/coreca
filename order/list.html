<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案件一覧 | ご近所ワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- ===== ヘッダー（共通パーツ: components/header.html） ===== -->
  <header class="site-header">
    <div class="header-inner">
      <!-- ロゴ -->
      <a href="../index.html" class="header-logo">
        <img src="../images/logo.png" alt="コレからワーク" class="header-logo-img">
        <span class="logo-role">発注者としてログイン中</span>
      </a>

      <!-- ナビゲーション（中央配置） -->
      <nav class="header-nav" id="headerNav">
        <ul class="nav-list">
          <li class="nav-item nav-item--active">
            <a href="list.html" class="nav-link">
              <span class="nav-text">案件作成・一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="../payment/list.html" class="nav-link">
              <span class="nav-text">報酬支払い情報</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="../message/list.html" class="nav-link">
              <span class="nav-text">メッセージ一覧</span>
            </a>
          </li>
        </ul>
      </nav>


      <!-- 右側: アカウント情報 -->
      <div class="nav-actions">
        <span class="nav-user">
          <span class="header-avatar-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <span class="header-username">aaaaaa さん</span>
        </span>
      </div>
      <!-- ハンバーガーメニュー（モバイル用） -->
      <button class="hamburger" id="hamburgerBtn" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- メインコンテンツ -->
  <main class="site-main">

    <!-- ===== サイドバー ===== -->
    <aside class="sidebar">
      <!-- 案件新規作成ボタン -->
      <a href="./create.html" class="btn-primary btn-primary--full">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        案件新規作成
      </a>

      <!-- タブ（進行中 / 完了） -->
      <nav class="sidebar-nav" aria-label="案件ステータス">
        <button class="sidebar-nav-btn tab-btn--active" data-tab="active">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          進行中（作業期間内）
        </button>
        <button class="sidebar-nav-btn" data-tab="done">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          完了
        </button>
      </nav>
    </aside>
    <!-- ===== /サイドバー ===== -->

    <!-- ===== メインコンテンツエリア ===== -->
    <div class="main-content">

      <!-- ページタイトル -->
      <div class="page-header">
        <h1 class="page-title">案件一覧</h1>
      </div>

      <!-- フィルタータブ行（左: タブ / 右: フィルター・並び替え） -->
      <div class="filter-bar">
        <div class="status-filters" id="statusFilters">
          <button class="filter-pill filter-pill--active" data-filter="all">全て</button>
          <button class="filter-pill filter-pill--no-hire" data-filter="no-hire">
            契約者なし
            <span class="pill-count" id="count-no-hire">0</span>
          </button>
          <button class="filter-pill filter-pill--need-action" data-filter="need-action">
            要応募者対応
            <span class="pill-count" id="count-need-action">0</span>
          </button>
          <button class="filter-pill filter-pill--accepting" data-filter="accepting">仕事引受け待ち</button>
          <button class="filter-pill filter-pill--contracted" data-filter="contracted">契約中</button>
          <button class="filter-pill filter-pill--need-inspection" data-filter="need-inspection">要検収</button>
          <button class="filter-pill filter-pill--unread-msg" data-filter="unread-msg">
            メッセージ未読
            <span class="pill-count" id="count-unread-msg">0</span>
          </button>
        </div>
        <div class="filter-bar-right">
          <!-- 絞り込み検索ボタン -->
          <button class="filter-ctrl-btn" id="filterSearchBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            絞り込み検索
          </button>
          <!-- 並び替えボタン + ドロップダウン -->
          <div class="sort-ctrl-wrap">
            <button class="filter-ctrl-btn" id="sortCtrlBtn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M6 12h12M9 18h6"/>
              </svg>
              並び替え
            </button>
            <div class="sort-panel" id="sortPanel">
              <button class="sort-option sort-option--active" data-sort="default">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 8h18M7 12h10M10 16h4"/></svg>
                デフォルト
              </button>
              <button class="sort-option" data-sort="start-date-desc">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
                掲載開始（新しい順）
              </button>
              <button class="sort-option" data-sort="start-date-asc">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                掲載開始（古い順）
              </button>
              <button class="sort-option" data-sort="end-date-asc">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                終了日（近い順）
              </button>
              <button class="sort-option" data-sort="end-date-desc">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
                終了日（遠い順）
              </button>
              <button class="sort-option" data-sort="contracts-desc">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
                契約者数（多い順）
              </button>
              <button class="sort-option" data-sort="contracts-asc">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                契約者数（少ない順）
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 検索バー + ページコントロール -->
      <div class="proj-toolbar">
        <div class="toolbar-right">
          <span class="toolbar-page-info" id="toolbarPageInfo">—</span>
          <div class="toolbar-page-nav">
            <button class="toolbar-nav-btn" id="toolbarPrevBtn" disabled>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="15 18 9 12 15 6"/>
              </svg>
            </button>
            <button class="toolbar-nav-btn" id="toolbarNextBtn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </button>
          </div>
          <select class="per-page-select" id="perPageSelect">
            <option value="5">5件</option>
            <option value="10" selected>10件</option>
            <option value="20">20件</option>
            <option value="50">50件</option>
          </select>
          <div class="view-toggle">
            <button class="view-btn view-btn--active" data-view="list" title="リスト表示">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
                <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
                <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
              </svg>
            </button>
            <button class="view-btn" data-view="grid" title="グリッド表示">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 案件テーブル（JS で描画） -->
      <div class="proj-table-wrap" id="projectList"></div>

      <!-- 空の表示 -->
      <div class="empty-state" id="emptyState" style="display:none;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <p>該当する案件がありません</p>
      </div>

      <!-- ページネーション -->
      <nav class="pagination" id="pagination" aria-label="ページネーション"></nav>

      <!-- フッターページネーション -->
      <div class="footer-pagination" id="footerPagination">
        <button class="btn-footer-page" id="footerPrevBtn" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          前の10件
        </button>
        <span class="footer-page-info" id="footerPageInfo"></span>
        <button class="btn-footer-page" id="footerNextBtn">
          次の10件
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>

    </div>
    <!-- ===== /メインコンテンツエリア ===== -->

  </main>

  <!-- ===== フッター（共通パーツ: components/footer.html） ===== -->
  <footer class="site-footer">
    <div class="footer-inner">

      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>
          <li><a href="#">利用規約</a></li>
          <li><a href="#">プライバシーポリシー</a></li>
          <li><a href="#">運営会社</a></li>
          <li><a href="#">お仕事を紹介したい方はこちら</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 2020 gokinjowork Inc.</p>
    </div>
  </footer>
  <!-- ===== /フッター ===== -->


  <!-- ===== 絞り込み検索モーダル ===== -->
  <div class="modal-overlay" id="filterModal" aria-modal="true" role="dialog" aria-labelledby="filterModalTitle">
    <div class="modal-dialog fmodal-dialog">

      <!-- ヘッダー -->
      <div class="modal-header">
        <h2 class="modal-title" id="filterModalTitle">絞り込み条件</h2>
        <button class="modal-close" id="btnCloseFilter" aria-label="閉じる">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- ボディ -->
      <div class="modal-body fmodal-body">
        <div class="fmodal-form">

          <!-- 案件ID -->
          <div class="fmodal-row">
            <label class="fmodal-label">案件ID</label>
            <div class="fmodal-field">
              <input type="text" class="fmodal-input fmodal-input--id" placeholder="">
            </div>
          </div>

          <!-- 募集ステータス -->
          <div class="fmodal-row">
            <label class="fmodal-label">募集ステータス</label>
            <div class="fmodal-field fmodal-field--checks">
              <label class="fmodal-check-label">
                <input type="checkbox" class="fmodal-checkbox">
                <span>募集中</span>
              </label>
              <label class="fmodal-check-label">
                <input type="checkbox" class="fmodal-checkbox">
                <span>募集停止</span>
              </label>
            </div>
          </div>

          <!-- 作業場所 -->
          <div class="fmodal-row">
            <label class="fmodal-label">作業場所</label>
            <div class="fmodal-field">
              <input type="text" class="fmodal-input" placeholder="">
            </div>
          </div>

          <!-- 作業・契約期間 -->
          <div class="fmodal-row">
            <label class="fmodal-label">作業・契約期間</label>
            <div class="fmodal-field fmodal-field--period">
              <select class="fmodal-select fmodal-select--year"><option value="">年</option><option>2023</option><option>2024</option><option>2025</option><option>2026</option></select>
              <select class="fmodal-select fmodal-select--month"><option value="">月</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select>
              <select class="fmodal-select fmodal-select--day"><option value="">日</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option></select>
              <span class="fmodal-period-sep">〜</span>
              <select class="fmodal-select fmodal-select--year"><option value="">年</option><option>2023</option><option>2024</option><option>2025</option><option>2026</option></select>
              <select class="fmodal-select fmodal-select--month"><option value="">月</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select>
              <select class="fmodal-select fmodal-select--day"><option value="">日</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option></select>
            </div>
          </div>

          <!-- コース名 -->
          <div class="fmodal-row">
            <label class="fmodal-label">コース名</label>
            <div class="fmodal-field">
              <input type="text" class="fmodal-input" placeholder="">
            </div>
          </div>

          <!-- 契約者名 -->
          <div class="fmodal-row">
            <label class="fmodal-label">契約者名</label>
            <div class="fmodal-field">
              <input type="text" class="fmodal-input" placeholder="">
            </div>
          </div>

          <!-- 要応募対応 -->
          <div class="fmodal-row">
            <label class="fmodal-label">要応募対応</label>
            <div class="fmodal-field fmodal-field--checks">
              <label class="fmodal-check-label"><input type="checkbox" class="fmodal-checkbox"><span>あり</span></label>
              <label class="fmodal-check-label"><input type="checkbox" class="fmodal-checkbox"><span>なし</span></label>
            </div>
          </div>

          <!-- 仕事引受待ち -->
          <div class="fmodal-row">
            <label class="fmodal-label">仕事引受待ち</label>
            <div class="fmodal-field fmodal-field--checks">
              <label class="fmodal-check-label"><input type="checkbox" class="fmodal-checkbox"><span>あり</span></label>
              <label class="fmodal-check-label"><input type="checkbox" class="fmodal-checkbox"><span>なし</span></label>
            </div>
          </div>

          <!-- 契約中 -->
          <div class="fmodal-row">
            <label class="fmodal-label">契約中</label>
            <div class="fmodal-field fmodal-field--checks">
              <label class="fmodal-check-label"><input type="checkbox" class="fmodal-checkbox"><span>あり</span></label>
              <label class="fmodal-check-label"><input type="checkbox" class="fmodal-checkbox"><span>なし</span></label>
            </div>
          </div>

          <!-- 要検収 -->
          <div class="fmodal-row">
            <label class="fmodal-label">要検収</label>
            <div class="fmodal-field fmodal-field--checks">
              <label class="fmodal-check-label"><input type="checkbox" class="fmodal-checkbox"><span>あり</span></label>
              <label class="fmodal-check-label"><input type="checkbox" class="fmodal-checkbox"><span>なし</span></label>
            </div>
          </div>

          <!-- 検収完了 -->
          <div class="fmodal-row">
            <label class="fmodal-label">検収完了</label>
            <div class="fmodal-field fmodal-field--checks">
              <label class="fmodal-check-label"><input type="checkbox" class="fmodal-checkbox"><span>あり</span></label>
              <label class="fmodal-check-label"><input type="checkbox" class="fmodal-checkbox"><span>なし</span></label>
            </div>
          </div>

          <!-- メッセージ未読 -->
          <div class="fmodal-row">
            <label class="fmodal-label">メッセージ未読</label>
            <div class="fmodal-field fmodal-field--checks">
              <label class="fmodal-check-label"><input type="checkbox" class="fmodal-checkbox"><span>未読あり</span></label>
              <label class="fmodal-check-label"><input type="checkbox" class="fmodal-checkbox"><span>未読なし</span></label>
            </div>
          </div>

          <!-- 並び順 -->
          <div class="fmodal-row fmodal-row--last">
            <label class="fmodal-label">並び順</label>
            <div class="fmodal-field">
              <select class="fmodal-select fmodal-select--sort">
                <option>案件登録日が新しい順</option>
                <option>案件登録日が古い順</option>
                <option>掲載開始（新しい順）</option>
                <option>掲載開始（古い順）</option>
                <option>終了日（近い順）</option>
                <option>終了日（遠い順）</option>
              </select>
            </div>
          </div>

        </div>
        <!-- /fmodal-form -->

        <!-- アクションボタン -->
        <div class="fmodal-actions">
          <button type="button" class="btn-fmodal-clear" id="btnFilterClear">クリア</button>
          <button type="button" class="btn-fmodal-submit" id="btnFilterSubmit">絞り込む</button>
        </div>

      </div>
      <!-- /fmodal-body -->

    </div>
    <!-- /fmodal-dialog -->
  </div>
  <!-- ===== /絞り込み検索モーダル ===== -->

  <script src="../js/projects.js"></script>
  <script src="../js/components.js"></script>
  <script>
    // 絞り込み検索モーダル開閉
    const filterModal     = document.getElementById('filterModal');
    const filterSearchBtn = document.getElementById('filterSearchBtn');
    const btnCloseFilter  = document.getElementById('btnCloseFilter');
    const btnFilterClear  = document.getElementById('btnFilterClear');

    function openFilterModal() {
      filterModal.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }
    function closeFilterModal() {
      filterModal.classList.remove('is-open');
      document.body.style.overflow = '';
    }

    filterSearchBtn.addEventListener('click', openFilterModal);
    btnCloseFilter.addEventListener('click', closeFilterModal);
    filterModal.addEventListener('click', function(e) {
      if (e.target === filterModal) closeFilterModal();
    });

    btnFilterClear.addEventListener('click', function() {
      filterModal.querySelectorAll('input[type="text"]').forEach(function(el) { el.value = ''; });
      filterModal.querySelectorAll('input[type="checkbox"]').forEach(function(el) { el.checked = false; });
      filterModal.querySelectorAll('select').forEach(function(el) { el.selectedIndex = 0; });
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && filterModal.classList.contains('is-open')) closeFilterModal();
    });
  </script>
</body>
</html>
