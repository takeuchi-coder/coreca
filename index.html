<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案件一覧 | ご近所ワーク</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== ヘッダー（共通パーツ: components/header.html） ===== -->
  <header class="site-header">
    <div class="header-inner">
      <!-- ロゴ -->
      <a href="/" class="header-logo">
        <span class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 3L2 12h3v13h7v-8h4v8h7V12h3L14 3z" fill="#fff"/>
          </svg>
        </span>
        <span class="logo-text">ご近所ワーク</span>
      </a>

      <!-- ナビゲーション（中央配置） -->
      <nav class="header-nav" id="headerNav">
        <ul class="nav-list">
          <li class="nav-item nav-item--active">
            <a href="index.html" class="nav-link">
              <span class="nav-text">案件作成・一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">報酬支払い情報</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">メッセージ一覧</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">お問い合わせ</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">メニュー・価格表</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <span class="nav-text">ヘルプ</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- 右側: 通知ベル ＋ アカウント情報 -->
      <div class="nav-actions">
        <!-- 通知ベル -->
        <a href="#" class="nav-bell" aria-label="通知">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="badge badge--red">3</span>
        </a>
        <!-- アカウント情報（プルダウン用チェブロン付き） -->
        <div class="nav-user">
          <span class="header-username">aaaaaa さん</span>
          <a href="#" class="header-avatar-btn" aria-label="アカウントメニュー">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <svg class="chevron-down" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </a>
        </div>
      </div>

      <!-- ハンバーガーメニュー（モバイル用） -->
      <button class="hamburger" id="hamburgerBtn" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>
  <!-- ===== /ヘッダー ===== -->

  <!-- メインコンテンツ -->
  <main class="site-main">

    <!-- ===== サイドバー ===== -->
    <aside class="sidebar">
      <!-- 案件新規作成ボタン -->
      <a href="#" class="btn-primary btn-primary--full">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        案件新規作成
      </a>

      <!-- タブ（進行中 / 完了） -->
      <nav class="sidebar-nav" aria-label="案件ステータス">
        <button class="sidebar-nav-btn tab-btn--active" data-tab="active">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          進行中（作業期間内）
        </button>
        <button class="sidebar-nav-btn" data-tab="done">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          完了
        </button>
      </nav>
    </aside>
    <!-- ===== /サイドバー ===== -->

    <!-- ===== メインコンテンツエリア ===== -->
    <div class="main-content">

      <!-- ページタイトル -->
      <div class="page-header">
        <h1 class="page-title">案件一覧</h1>
      </div>

      <!-- 件数 + 表示件数（右揃えで横並び） -->
      <div class="list-controls">
        <div class="list-controls-right">
          <p class="list-count">
            <strong id="totalCount">0</strong> 件中
            <strong id="rangeLabel">1〜10</strong> 件表示
          </p>
          <select class="per-page-select" id="perPageSelect">
            <option value="5">5件</option>
            <option value="10" selected>10件</option>
            <option value="20">20件</option>
            <option value="50">50件</option>
          </select>
        </div>
      </div>

      <!-- ステータスフィルター -->
      <div class="status-filters" id="statusFilters">
        <button class="filter-pill filter-pill--active" data-filter="all">全て</button>
        <button class="filter-pill filter-pill--red" data-filter="no-hire">
          採用者なし
          <span class="pill-count" id="count-no-hire">0</span>
        </button>
        <button class="filter-pill filter-pill--orange" data-filter="need-action">
          要対応
          <span class="pill-count" id="count-need-action">0</span>
        </button>
        <button class="filter-pill" data-filter="accepting">仕事を受け付ける</button>
        <button class="filter-pill" data-filter="contracted">契約中</button>
        <button class="filter-pill" data-filter="need-inspection">要収</button>
        <button class="filter-pill filter-pill--red" data-filter="unread-msg">
          未読メッセージ
          <span class="pill-count" id="count-unread-msg">0</span>
        </button>
        <button class="filter-pill filter-pill--detail" data-filter="search">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          詳細検索
        </button>
      </div>

      <!-- 案件リスト（JS で描画） -->
      <div class="project-list" id="projectList"></div>

      <!-- 空の表示 -->
      <div class="empty-state" id="emptyState" style="display:none;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <p>該当する案件がありません</p>
      </div>

      <!-- ページネーション -->
      <nav class="pagination" id="pagination" aria-label="ページネーション"></nav>

    </div>
    <!-- ===== /メインコンテンツエリア ===== -->

  </main>

  <!-- ===== フッター（共通パーツ: components/footer.html） ===== -->
  <footer class="site-footer">
    <div class="footer-inner">

      <!-- フッターページネーション -->
      <div class="footer-pagination" id="footerPagination">
        <button class="btn-footer-page" id="footerPrevBtn" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          前の10件
        </button>
        <span class="footer-page-info" id="footerPageInfo"></span>
        <button class="btn-footer-page" id="footerNextBtn">
          次の10件
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>

      <nav class="footer-nav">
        <ul class="footer-nav-list">
          <li><a href="#">お知らせ</a></li>
          <li><a href="#">利用規約</a></li>
          <li><a href="#">プライバシーポリシー</a></li>
          <li><a href="#">運営会社</a></li>
          <li><a href="#">お仕事を紹介したい方はこちら</a></li>
        </ul>
      </nav>
      <p class="footer-copy">&copy; 2020 gokinjowork Inc.</p>
    </div>
  </footer>
  <!-- ===== /フッター ===== -->

  <script src="js/projects.js"></script>
  <script src="js/components.js"></script>
</body>
</html>
